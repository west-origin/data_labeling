     files: [packages/schema/src/dlp_schema/description_follow.py, packages/actions/src/dlp_actions/translate.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PAR-16],
     note: "사람이 쓴 설명의 비교 기준은 쓴 시각에 현재였던 주인 레코드다 (다시 만든 설명과 같은 방식, ADR 0043 3절 비교 기준). 회귀: packages/actions/tests/test_translate.py::test_translation_of_human_description_for_corrected_action_is_kept, packages/schema/tests/test_description_follow.py::test_translation_of_human_description_compares_owners_at_writing"}
  - {id: F-PMS-15, title: "보류 A의 늦은 렌더 무효화가 A 해제·재승인·재렌더 뒤에 돌아 새 렌더를 무효로 덮어씀", severity: medium, status: fixed, kind: code,
     files: [packages/privacy/src/dlp_privacy/hold.py, packages/cli/src/dlp_cli/privacy_cmds.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PMS-14],
     note: "invalidate_hold_renders는 별도 트랜잭션에서 같은 세션 잠금을 잡고 보류 A가 아직 지금 유효한 보류일 때만 쓴다. 아니면 superseded로 알리고 건너뛴다. 보류 DB 커밋이 먼저인 순서는 그대로 (ADR 0042). 회귀: packages/privacy/tests/test_hold.py::test_delayed_invalidation_of_an_old_hold_keeps_a_newer_render"}
  - {id: F-PMS-16, title: "dlp privacy hold가 보류 DB 커밋 전에 저장소 클라이언트를 만들어, 잘못된 AWS 프로필·설정이 보류 기록을 막음", severity: low, status: fixed, kind: code,
     files: [packages/cli/src/dlp_cli/privacy_cmds.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PMS-14],
     note: "클라이언트는 보류 DB 단계 커밋 뒤에 만든다. 생성 실패는 렌더 기록 무효화 실패로 알리고 종료 코드 5. 회귀: packages/cli/tests/test_revoke_cmds.py::test_privacy_hold_is_recorded_even_when_the_store_client_cannot_be_created"}
  - {id: F-COE-16, title: "FiftyOne 왕복 테스트가 모든 예외를 건너뛰기로 바꿔 실제 의존성 비호환도 숨김", severity: low, status: fixed, kind: test,
     files: [packages/active/tests/test_curation.py], source: docs/handover/external-review-2026-10-15.md, see: [F-COE-14],
     note: "미설치(find_spec 없음)와 연결 예외(내장 ConnectionError·TimeoutError, pymongo·FiftyOne 서비스 예외, 그것을 원인으로 감싼 예외)만 건너뛴다. 설치된 뒤의 import 실패·그 밖의 예외는 실패한다. 회귀: packages/active/tests/test_curation.py::test_only_connection_errors_skip_the_round_trip"}
  - {id: F-PAR-23, title: "설명 재생성·번역의 최종 쓰기가 사용 중지·승인 보류·렌더 변경을 다시 확인하지 않음", severity: low, status: fixed, kind: code,
     files: [packages/actions/src/dlp_actions/write_check.py, packages/actions/src/dlp_actions/describe.py, packages/actions/src/dlp_actions/translate.py, packages/cli/src/dlp_cli/actions_cmds.py, packages/cli/src/dlp_cli/translate_cmds.py], source: docs/handover/external-review-2026-10-15.md,
     note: "쓰기 직전 세션 잠금 아래 사용 중지·승인 보류·(프레임을 보냈으면) 렌더 해시를 다시 본다 (내보내기 최종 게시 확인과 같은 방식). 막히면 아무것도 쓰지 않고 blocked로 알린다 (describe 종료 3, 번역은 대기). 회귀: packages/actions/tests/test_describe.py::test_final_write_rechecks_hold_withdrawal_and_render_under_the_lock (보류·사용 중지·승인 해제), ::test_final_write_check_passes_when_nothing_changed, packages/actions/tests/test_translate.py::test_final_write_rechecks_hold_and_withdrawal_under_the_lock"}
  - {id: F-PAR-24, title: "dlp actions describe --pending이 물려받기 기록 없이 계획해, 물려받은 설명의 행동이 다시 바뀐 세션을 건너뜀", severity: medium, status: fixed, kind: code,
     files: [packages/cli/src/dlp_cli/actions_cmds.py, packages/actions/src/dlp_actions/describe.py, packages/schema/src/dlp_schema/description_follow.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PAR-20],
     note: "describe_pending이 plan_describe에 물려받기 기록을 넘기지 않아(기본값 빈 목록) 물려받은 설명을 직접 검수로 보고 대상을 놓쳤다 (describe_session은 처리). DB에서 계획하는 곳은 plan_session_describe(이력+기록)를 쓰고, plan_describe·plan_description_follow의 inheritance 인자는 기본값 없이 필수다 (빠뜨리면 pyright가 잡는다). 회귀: packages/cli/tests/test_actions_describe_cmd.py::test_describe_pending_sees_inherited_descriptions_of_changed_actions, tests/test_inheritance_required.py (기본값 없음, 저장소의 모든 호출이 기록 인자를 넘김)"}
  - {id: F-PMS-17, title: "dlp privacy hold 커밋 뒤 회수 실행기의 클라이언트 생성 실패(잘못된 AWS 프로필)가 보류 결과·복구 안내 전에 예외로 끝남", severity: low, status: fixed, kind: code,
     files: [packages/cli/src/dlp_cli/privacy_cmds.py, packages/cli/src/dlp_cli/review_config.py, packages/review/src/dlp_review/revoke.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PMS-16],
     note: "run_revocations는 회수 전용 설정 생성 실패(저장소·AWS 프로필·도구 설정)를 예외로 올리지 않고 RevocationReport.setup_error와 DB의 대기로 돌려준다 (complete 거짓, 다른 회수 호출자도 종료 코드 4). cmd_hold는 커밋된 보류 결과를 먼저 출력하고 실패·재시도 명령을 보인 뒤 종료 코드 5, 엔진은 finally에서 정리한다. 회귀: packages/cli/tests/test_revoke_cmds.py::test_privacy_hold_reports_revocation_setup_failure_after_commit"}
  - {id: F-PAR-25, title: "물려받은 설명을 같은 상태·검수자·시각으로 직접 다시 검수하면 물려받음과 구분되지 않아 다음 회차에 지워짐", severity: low, status: open, kind: code,
     files: [packages/schema/src/dlp_schema/description_follow.py, packages/schema/src/dlp_schema/db/repository.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PAR-20],
     repro: tests/test_known_defects.py::test_same_tuple_direct_review_after_inheritance_is_protected,
     note: "record_review는 행의 검수 칸만 갱신하고 흔적을 남기지 않는다. 직접 검수의 상태·검수자·시각이 마지막 물려받기 기록과 정확히 같으면 지금 상태가 그 기록과 같아 물려받은 검수만 있는 것으로 본다 (description_follow._active). 지금 경로에서 일어나기 어렵다: 설명은 검수 도구 경로가 없고, 표본 검증(sampling:<배정>)·수집은 검수 시각이 그 실행의 now라 물려준 주인의 검수 시각과 같으려면 같은 검수자가 그 시각을 그대로 다시 써야 한다. 깔끔한 고침은 직접 검수도 추가 전용 기록에 남겨 마지막 기록이 이기게 하는 것(예: description_inheritance에 mechanism direct, giver 없음)인데 계약·DB 변경(ADR 0043 개정, Alembic, make schemas)이라 이번 회차에 하지 않았다."}
  # ── 손가락 끝 3D (ADR 0044) 후속 ──
  - {id: F-PAR-26, title: "손가락 끝·손 3D가 카메라 좌표뿐: IMU 기반 시각-관성 SLAM으로 세션 고정 월드 좌표가 필요", severity: medium, status: open, kind: product,
     files: [packages/prelabel/src/dlp_prelabel/adapters/stubs.py, packages/prelabel/src/dlp_prelabel/lift3d.py, config/policies/prelabel.yaml], source: docs/adr/0044-fingertip-3d-from-hand-world-landmarks.md,
     note: "3단계(사용자 요청). 바디캠 6자유도(stubs.CAMERA_POSE, TODO(real-model))를 시각-관성 SLAM(Basalt BSD-3, 카메라-IMU 캘리브레이션 필요, IMU는 dlp_media GPMF·사이드카 추출기가 이미 받는다) 또는 메트릭 깊이 + RGB-D 오도메트리(Open3D MIT)로 만들고, 카메라 좌표 trajectory3d를 frame=world로 바꾼 새 궤적(source_3d=visual_inertial_slam)을 낸다. 내부 파라미터 등록 절차는 ADR 0045(dlp calib intrinsics|import, docs/handover/camera-calibration.md)로 생겼다. 카메라-IMU 외부 파라미터 캘리브레이션은 아직 없다."}
  - {id: F-PAR-27, title: "손 메시 모델(HaMeR·WiLoR)은 MANO 비상업 라이선스라 쓸 수 없어, 손 3D 모양은 MediaPipe world landmarks뿐", severity: low, status: open, kind: product,
     files: [config/models.yaml, packages/prelabel/src/dlp_prelabel/handfit.py], source: docs/adr/0044-fingertip-3d-from-hand-world-landmarks.md,
     note: "ADR 0010: 판매용 라벨에는 비상업 가중치·손 모델을 쓰지 않는다. HaMeR·WiLoR·FrankMocap 등은 MANO 파라미터 회귀라 MANO 라이선스(비상업 연구)에 묶인다. 상업 사용 가능한 손 메시·3D 손 자세 모델(가중치·학습 데이터 라이선스 확인)이 생기면 Predictor 어댑터·CPU stub과 함께 handfit의 손 모양 입력으로 바꿀 수 있다. 그때까지 손 모양 정확도는 MediaPipe world landmarks 수준이고 실영상 오차는 측정하지 않았다."}
  - {id: F-PAR-28, title: "등록한 렌즈 왜곡 계수를 3D 단계가 쓰지 않아 광각 바디캠 화면 가장자리 손의 3D가 틀릴 수 있음", severity: low, status: open, kind: product,
     files: [packages/prelabel/src/dlp_prelabel/lift3d.py, packages/prelabel/src/dlp_prelabel/handfit.py, packages/media/src/dlp_media/calibration.py], source: docs/adr/0045-3d-sample-quality-calibration-and-hand-size.md, see: [F-PAR-26],
     note: "ADR 0045: dlp calib intrinsics·import는 OpenCV 왜곡 계수(k1, k2, p1, p2, k3)를 camera_calibrations에 기록하지만, lift3d.intrinsics_for·handfit은 핀홀(fx·fy·cx·cy)만 쓴다. 고치려면 2D 키포인트·박스 중심을 cv2.undistortPoints로 정규화 좌표로 바꾼 뒤 맞춤·역투영하고(깊이 맵 표본 위치는 원래 픽셀), 3D 단계 버전 판을 올린다. 어안(초광각) 모드는 cv2.fisheye 모델과 캘리브레이션 경로가 따로 필요하다. 합성 시험은 왜곡을 넣은 체커보드·손 픽스처로 만든다."}
