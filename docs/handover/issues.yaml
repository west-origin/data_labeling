# 알려진 문제 레지스트리 (단일 출처). 외주 검수·리팩토링은 새 발견을 이 목록과 대조해
# "기존 ID 중복"인지 "신규"인지 먼저 가른다. 사람이 읽는 설명은 각 source 문서에 있다.
#
# 필드:
#   id        S·R(known-issues), T(training-loop-review), O(ontology-structure-review),
#             A-nn(audit-notes, 재현 전 후보), F-<영역>-nn(2026-10-11 전수 검수). 지우지 않고 status만 바꾼다.
#   title     한 줄 요약
#   severity  high | medium | low
#   status    open(확정·미수정) | candidate(재현 전 후보) | fixed(반영) | superseded(다른 ID로 옮김)
#   kind      code | comment | test | ops | product
#   files     관련 경로 (저장소 루트 기준, 있어야 한다)
#   source    설명이 있는 문서
#   repro     (선택) 재현 테스트 `경로::함수`. 확정·미수정 결함의 재현은 tests/test_known_defects.py에
#             xfail(strict=True)로 둔다. 고치면 XPASS가 실패로 떠서 이 항목 갱신을 강제한다.
#   see       (선택) 관련 ID
#   note      (선택) 보충
# 영역 코드: SCH(schema) REV(review) PMS(privacy·media·sync) PAR(prelabel·actions·relations·models)
#            ETA(evaluation·training·active·datasets) COE(cli·export·ops·fixtures·스크립트)
# 검사: tests/test_issue_registry.py (ID 형식·중복, 값, 경로, 재현 테스트, 문서 속 ID 대응).

