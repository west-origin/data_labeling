     files: [packages/schema/src/dlp_schema/description_follow.py, packages/schema/src/dlp_schema/label_validation.py, packages/schema/src/dlp_schema/db/description_repository.py, packages/schema/src/dlp_schema/db/inheritance_repository.py, packages/schema/src/dlp_schema/db/migrations/versions/0021_description_inheritance.py, packages/schema/src/dlp_schema/review.py], source: docs/handover/external-review-2026-10-15.md, see: [F-PAR-19],
     note: "사용자 결정('추천대로'): 물려받음을 명시 기록으로 남긴다. 추가 전용 표 description_inheritance(Alembic 0021, 계약 DescriptionInheritance: 설명·주인 목록·준 주인·상태·검수자·시각·경로·규칙 버전)를 물려받는 record_review와 같은 트랜잭션에 쓴다. inheritance_only·inherited_owner·저장 검증 예외는 설명의 마지막 기록이 지금 검수 상태와 같을 때만 물려받음으로 본다 (기록 없음 = 직접 검수). F-PAR-19의 남은 한계(같은 행동 레코드 재승인 뒤 물려받음 상실)도 없앴다. 이전 데이터는 0021이 예전 추정으로 한 번 백필(backfill-heuristic, 추정의 한계는 이전 데이터에만). 회귀: packages/schema/tests/test_description_follow.py::test_direct_review_with_same_reviewer_and_time_is_not_inheritance, ::test_rereviewing_the_giving_owner_keeps_inheritance, ::test_later_direct_review_ends_inheritance, packages/review/tests/test_description_follow.py::test_directly_reviewed_description_with_owner_reviewer_and_time_stays_protected, ::test_reapproving_the_giving_owner_keeps_inheritance_for_a_later_change, packages/schema/tests/test_description_inheritance_migration.py, packages/schema/tests/test_db.py::test_description_inheritance_is_append_only"}
