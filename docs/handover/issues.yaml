     note: "response.max_findings 0. 잡음·스키마 비용 때문에 파일럿에서 켤지 정한다. 응답 재검사(값·프레임·상자 범위, 같은 종류 라벨과 겹침 제거, 이유 안전 검사)는 구현했고 검수 화면 표시(LS AI:누락?, CVAT 이슈)는 WP17.6 뒤 후속"}
  - {id: F-AIR-09, title: 장갑+영상 융합 접촉의 영상 대상은 AI가 판정하지 않음, severity: low, status: open, kind: product,
     files: [packages/aireview/src/dlp_aireview/plan.py, packages/prelabel/src/dlp_prelabel/runner.py], source: docs/adr/0040-ai-first-pass-review.md,
     note: "결정(장갑 센서 출처 라벨 제외)에 따라 장갑이 관여한 접촉(증거 OBSERVED: 장갑만·융합)을 통째로 뺀다. 융합 접촉의 대상(영상 근거)만 판정할지, 프리라벨 증거 규칙을 바꾸는 다른 자동 손 상태 단계가 생길 때 표시를 어떻게 둘지는 파일럿 뒤 결정"}
  - {id: F-AIR-10, title: 골든 게이트 실패를 차단할지 미정 (지금은 경고만), severity: low, status: open, kind: product,
     files: [config/policies/aireview.yaml, packages/aireview/src/dlp_aireview/evaluate.py, packages/cli/src/dlp_cli/aireview_eval_cmds.py], source: docs/adr/0040-ai-first-pass-review.md,
     note: "결정에 따라 dlp aireview eval --gate가 실패해도 종료 0이다 (gate.block false). 파일럿(WP17.9) 골든 결과를 보고 block을 true로 바꿀지(종료 1) 정한다. 평가는 장갑 원본을 읽지 않아 손 상태의 센서 대조 문제 유형을 재지 않고, MLflow에 기록하지 않는다"}
  - {id: F-AIR-11, title: 층화 ok 놓침률의 합친 상한이 층별 상한의 가중 합(보수적 근사), severity: low, status: open, kind: product,
     files: [packages/review/src/dlp_review/ops/ai_quality.py], source: docs/adr/0040-ai-first-pass-review.md,
     note: "층별 한쪽 95% 상한을 모집단 크기로 가중해 합친다. 층마다 따로 95%라 합친 값의 동시 신뢰 수준은 더 낮고 값은 보수적(크다)이다. 층 안의 비율은 행 표본 가중(배정마다 다른 가중치, 검증 지적 반영)이고 가중치가 섞인 층의 상한은 Kish 유효 표본 수로 낸 Korn-Graubard 근사다(dlp_eval.metrics.proportion.effective_upper). 사람 생략 ADR(ADR 0040 8절)의 근거로 쓰기 전에 층화 구간 방법(층 결합, 묶음 군집 분산)을 정한다. 검수 시간 효과도 지적 밀도 층으로 나누지 않았다"}
  - {id: F-AIR-13, title: 보낸 뒤 다른 단계가 바꾼 라벨의 종류를 검수자가 Label Studio에서 바꿔 붙이면 원 라벨 없는 새 레코드가 남음, severity: medium, status: open, kind: code,
     files: [packages/review/src/dlp_review/collect.py, packages/review/src/dlp_review/labelstudio.py], source: docs/adr/0040-ai-first-pass-review.md,
     note: "AI와 무관한 기존 수집 경로 결함 (WP17.7 검증에서 발견). 종류를 바꿔 붙인 구간은 원 라벨 ID를 잃어(labelstudio._reviewed_item) parent 없는 새 레코드가 되고, drop_retracted는 parent가 있는 결과만 빼므로 그 레코드가 남는다. 다른 단계가 지운 라벨이 다른 종류로 되살아나거나 새 버전 라벨과 같은 손·구간에 겹친다. AI 적용 경로는 stale 라벨에 적용하지 않게 막았다(ai_collect, test_ai_collect.py::test_stale_label_apply_is_invalid_now). 새로 그린 구간과 종류 변경을 구별할 근거(원 라벨 ID 보존)가 필요하다.",
     repro: tests/test_known_defects.py::test_relabel_of_a_retracted_label_does_not_revive_it}
  - {id: F-AIR-14, title: 골든 평가 history 방식의 맥락에 정답으로 쓰지 않은 사람 추가 레코드가 남음, severity: low, status: open, kind: product,
     files: [packages/aireview/src/dlp_aireview/evaluate.py], source: docs/adr/0040-ai-first-pass-review.md,
     note: "맥락은 대상·후손·정답으로 쓴 레코드(같은 손·구간을 다른 종류로 다시 그린 레코드)를 뺀 현재 라벨이다. 검수자가 따로 새로 그린 레코드(예: 지운 행동 자리에 짧은 행동 둘)는 판정 시점에 없던 정보지만 맥락에 남아 history 지표가 약간 낙관적일 수 있다. 판정 시점의 이력(검수 전 상태)으로 맥락을 되돌리는 방법은 파일럿 뒤 정한다"}
  - {id: F-AIR-12, title: "AI 끔(mode off)으로 수집하면 검수자가 고른 AI 결정을 버리고 결과 기록도 남기지 않음", severity: low, status: open, kind: product,
