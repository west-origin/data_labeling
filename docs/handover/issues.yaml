  - {id: F-PAR-19, title: "물려받은 설명은 보호돼, 승인된 행동을 다음 검수 회차에서 다시 고치거나 지우면 낡은 설명이 승인된 채 남음", severity: medium, status: fixed, kind: product,
     files: [packages/schema/src/dlp_schema/description_follow.py, packages/schema/src/dlp_schema/label_validation.py], source: docs/adr/0043-bilingual-labels.md, see: [F-PAR-15, F-PAR-16, F-PAR-18],
     note: "사용자 결정('추천안대로', ADR 0043 3절 규칙 6): 물려받은 승인은 사람이 설명문을 읽은 것이 아니다. 물려받은 검수만 있는 모델 설명(inheritance_only: 승인·표본 검증 + inherited_owner로 물려준 주인을 다시 계산)은 주인의 의미가 다시 바뀌거나 전부·일부 지워지면 설명 따르기가 지우고(ko·en), dlp actions describe·번역이 다시 만들어 새로 물려받는다. DB·계약 변경 없음. 저장 검증 예외는 review-follow-1 삭제 + 설명 + inheritance_only + 같은 이력의 계획이 지우는 경우뿐. 직접 검수·사람 설명은 보호 유지. 처음 남긴 한계(물려준 행동 레코드를 같은 레코드로 다시 승인한 뒤에는 다시 계산할 수 없어 보호 유지)는 2026-10-15 명시 물려받기 기록(F-PAR-20, Alembic 0021)으로 없앴다 (회귀 packages/review/tests/test_description_follow.py::test_reapproving_the_giving_owner_keeps_inheritance_for_a_later_change). 회귀: packages/schema/tests/test_description_follow.py (::test_inherited_description_is_retracted_when_owner_changes_again, ::test_inherited_description_follows_owner_deletion_and_bimanual_partial_delete, ::test_sample_verified_inherited_description_follows_owner_change, ::test_direct_review_human_text_and_unrecoverable_inheritance_stay_protected), packages/schema/tests/test_protected_retraction.py (::test_follow_may_retract_inheritance_only_description_after_owner_change, ::test_follow_exception_is_narrow), packages/review/tests/test_description_follow.py::test_inherited_descriptions_follow_a_later_review_round, packages/actions/tests/test_describe.py::test_inherited_description_is_replaced_when_owner_changes_in_a_later_round"}
