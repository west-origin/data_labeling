[project]
name = "data-labeling"
version = "0.1.0"
description = "1인칭 돌봄 영상 라벨링 플랫폼 (워크스페이스 루트)"
requires-python = ">=3.12,<3.14"
dependencies = ["dlp-actions", "dlp-active", "dlp-aireview", "dlp-cli", "dlp-datasets", "dlp-eval", "dlp-export", "dlp-fixtures", "dlp-media", "dlp-models", "dlp-ops", "dlp-prelabel", "dlp-privacy", "dlp-relations", "dlp-retarget", "dlp-review", "dlp-schema", "dlp-sync", "dlp-train"]

[tool.uv]
package = false
# 잠금 파일을 같은 방식으로 해석하도록 uv 최소 버전을 둔다 (CI는 .github/workflows/ci.yml에서 정확한 버전 고정)
required-version = ">=0.11"
# MediaPipe는 GUI판 opencv-contrib-python을, FiftyOne은 opencv-python-headless를 요구하지만, 같은 cv2
# 모듈을 주는 판끼리 함께 깔면 충돌한다. 작업공간 전체를 opencv-contrib-python-headless(상위 집합)로
# 통일하고 다른 판 요구는 지운다.
override-dependencies = [
    "opencv-contrib-python ; sys_platform == 'never'",
    "opencv-python ; sys_platform == 'never'",
    "opencv-python-headless ; sys_platform == 'never'",
    # FiftyOne 1.22.1의 오래된 Mongo 드라이버 핀을 보안 패치 버전으로 대체한다 (ADR 0035).
    # Motor 3.7.1은 PyMongo <5를 지원한다. 실제 큐레이션 CRUD/비동기 왕복으로 검증한다.
    "motor==3.7.1",
    "pymongo>=4.18.2,<5",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dlp-actions = { workspace = true }
dlp-active = { workspace = true }
dlp-aireview = { workspace = true }
dlp-cli = { workspace = true }
dlp-datasets = { workspace = true }
dlp-eval = { workspace = true }
dlp-export = { workspace = true }
dlp-fixtures = { workspace = true }
dlp-media = { workspace = true }
dlp-models = { workspace = true }
dlp-ops = { workspace = true }
dlp-prelabel = { workspace = true }
dlp-relations = { workspace = true }
dlp-retarget = { workspace = true }
dlp-privacy = { workspace = true }
dlp-review = { workspace = true }
dlp-schema = { workspace = true }
dlp-sync = { workspace = true }
dlp-train = { workspace = true }
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval", rev = "12c8791b303e0a0b50f753af204249e622d0281a" }

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "jsonschema>=4.23",
    "motmetrics>=1.4.0",
    "opencv-contrib-python-headless>=4.10",
    "pycocotools>=2.0.11",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "scikit-learn>=1.9.1",
    "trackeval",
    "types-pyyaml>=6.0",
]

# 데이터 큐레이션(FiftyOne, Apache-2.0)은 설치가 커서(약 1 GB, 내장 MongoDB) 선택 그룹으로 둔다.
# make install-curation
curation = [
    "fiftyone>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/cvat/.src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C901"]

# 함수 복잡도 상한 (외주 리팩토링 중 함수가 다시 커지지 않게). 지금 상한을 넘는 함수 13개는 def 줄에
# `# noqa: C901`을 달아 기준선으로 둔다. 그 표시가 곧 분해 대상 목록이다 (`grep -rn "noqa: C901" packages`).
# 분해해서 상한 안으로 들어오면 표시를 지운다. 새 표시는 늘리지 않는다.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dlp_actions", "dlp_active", "dlp_aireview", "dlp_cli", "dlp_datasets", "dlp_eval", "dlp_export", "dlp_fixtures", "dlp_media", "dlp_models", "dlp_ops", "dlp_prelabel", "dlp_privacy", "dlp_relations", "dlp_review", "dlp_schema", "dlp_sync", "dlp_train"]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/.venv", "services/cvat/.src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not services and not isolated_env"]
# FiftyOne·mongoengine 내부의 사용 중단 경고 (우리 코드가 아님)
filterwarnings = ["ignore::DeprecationWarning:fiftyone", "ignore::DeprecationWarning:mongoengine"]
markers = [
    "services: 실행 중인 docker compose 서비스가 필요한 테스트 (make up 후 실행)",
    "isolated_env: 격리된 일회용 환경(LeRobot·PyTorch CPU판)을 받는 테스트 (make test-isolated)",
]

# make coverage. 실행하지 않은 모듈도 0%로 보이게 packages 아래 소스 전체를 센다
# (src 디렉터리와 dlp_media에는 __init__.py가 없어 이름공간 패키지 포함이 필요하다).
[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/migrations/versions/*"]

[tool.coverage.report]
include_namespace_packages = true
