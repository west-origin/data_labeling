[project]
name = "data-labeling"
version = "0.1.0"
description = "1인칭 돌봄 영상 라벨링 플랫폼 (워크스페이스 루트)"
requires-python = ">=3.12,<3.14"
dependencies = ["dlp-cli", "dlp-fixtures", "dlp-schema"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dlp-cli = { workspace = true }
dlp-fixtures = { workspace = true }
dlp-schema = { workspace = true }

[dependency-groups]
dev = [
    "opencv-python-headless>=4.10",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/cvat/.src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dlp_cli", "dlp_fixtures", "dlp_schema"]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/.venv", "services/cvat/.src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not services"]
markers = [
    "services: 실행 중인 docker compose 서비스가 필요한 테스트 (make up 후 실행)",
]
