# 로봇 리타기팅 mink 풀이기용 격리 환경 (retarget.yaml solver: mink, scripts/retarget_mink.py, ADR 0047).
# 작업공간 멤버가 아니다: MuJoCo·mink·QP 풀이기를 작업공간에 넣지 않아 make install을 가볍게 둔다.
# 모든 패키지(전이 의존성 포함)의 버전과 해시는 이 디렉터리의 uv.lock에 고정한다.
# 바꾼 뒤에는 이 디렉터리에서 `uv lock`을 다시 한다 (실행은 --locked라 잠금 파일과 어긋나면 실패한다).
# 라이선스: mink Apache-2.0, MuJoCo Apache-2.0, daqp MIT, qpsolvers LGPL-3.0(수정 없이 동적 import만, ADR 0047).
[project]
name = "dlp-retarget-env"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "mink==1.3.0",
    "mujoco==3.16.0",
    "daqp==0.10.3",
    "numpy>=2.0",
]

[tool.uv]
# 이 디렉터리는 설치할 패키지가 아니라 의존성 묶음일 뿐이다
package = false
