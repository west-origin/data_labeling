name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: make install
      - name: System libraries for MediaPipe (EGL/GLES, CPU inference)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('config/models.yaml', 'scripts/export_depth_onnx.py') }}
      - name: Fetch model weights (YuNet, MediaPipe, RTMPose, OWLv2 ~360 MB)
        run: make models
      - name: Export depth model to ONNX (cached after first run)
        run: make export-models
      - run: make check

  services:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: make install
      - name: Validate compose file
        run: cp .env.example .env && docker compose --env-file .env -f services/docker-compose.yml config -q
      - name: Start services
        run: make up
      - run: make health
      - run: make test-services
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f services/docker-compose.yml logs --tail=200
      - if: always()
        run: make clean
