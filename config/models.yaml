# 모델 가중치 목록. `make models`가 받아 sha256을 확인한다 (data/models/, 저장소에는 넣지 않는다).
# 정책 파일(privacy.yaml, prelabel.yaml, actions.yaml vlm.model)은 여기 이름으로 모델을 가리킨다.
#   url: 직접 받는 파일. archive_member가 있으면 zip을 받아 그 이름으로 끝나는 파일을 꺼낸다
#        (sha256은 zip의 해시, artifact_sha256은 추출 파일의 해시).
#   export: 공개 ONNX가 없어 공식 가중치를 직접 변환한다 (스크립트 실행, make export-models).
#           sha256은 내보낸 환경의 값이며 PyTorch 버전에 따라 달라질 수 있다.
#
# 상업 사용 분류 (라벨링한 데이터를 판매하는 것도 상업 사용이다). ADR 0010.
#   allowed:   가중치 라이선스가 상업 사용을 허용하고, 직접 학습·미세조정 데이터에 비상업 조건이 없다.
#   review:    가중치 라이선스는 허용하지만, 직접 학습 데이터에 비상업·연구용 조건이 있다.
#              배포자는 상업 라이선스를 달았지만 법적 해석이 갈린다. 판매 전 법무 확인 대상.
#   forbidden: 가중치 자체가 비상업 라이선스다.
# 정책이 쓰는 모델은 accept에 든 분류여야 한다 (make check가 검사한다).
# 법무 확인 뒤 review를 빼면 review 모델을 쓰는 정책이 검사에서 걸린다.
# 읽는 곳: dlp_models.registry (load_registry, resolve, fetch). 파싱된 값으로만 읽으므로 주석은 어떤
# 해시에도 들어가지 않는다. 라벨의 모델 버전에는 등록 sha256이 아니라 실제 파일 해시가 들어간다.
# 항목 필드:
#   path: 저장소 루트 기준 경로 (data/models/ 아래). sha256: 등록 해시.
#   license: 가중치 라이선스. training_data: 직접 학습·미세조정 데이터와 그 라이선스.
#   commercial: 위 분류. 새 모델은 이 셋을 반드시 적는다 (CLAUDE.md, ADR 0010).
# 형식 버전 (코드가 검사하지 않는다)
version: 2
# 정책이 쓸 수 있는 분류 목록 (make licenses가 검사)
accept: [allowed, review]
models:
  # 얼굴 탐지 (프라이버시 게이트 dlp_privacy.detectors.yunet, privacy.yaml)
  yunet:
    path: data/models/face_detection_yunet_2023mar.onnx
    url: https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
    sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    license: MIT
    training_data: ["WIDER FACE (CC BY-NC-ND 4.0)"]
    commercial: review
  # 손 21관절 (prelabel.yaml models.hands → MediaPipeHands). 2D와 함께 손 중심 3D 점(hand_world_landmarks)도
  # 싣고 손가락 끝 3D 맞춤에 쓴다 (ADR 0044). 손 메시 모델 HaMeR·WiLoR는 MANO(비상업 라이선스)에 묶여 쓰지 않는다 (F-PAR-27)
  hand_landmarker:
    path: data/models/hand_landmarker.task
    url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
    sha256: fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1
    license: Apache-2.0
    training_data: ["Google 자체 수집 실사·합성 손 이미지 (모델 카드)"]
    commercial: allowed
  # COCO 객체 박스 (prelabel.yaml models.coco_objects → MediaPipeObjects)
  object_detector:
    path: data/models/efficientdet_lite0.tflite
    url: https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/latest/efficientdet_lite0.tflite
    sha256: 4b59100025bea1235a84c1038879a6cccc9f6c49f5e41144e91e74d99e780993
    license: Apache-2.0
    # COCO 이미지는 Flickr 사진마다 다른 CC 라이선스이고 CC BY-NC 계열이 섞여 있다 (비상업 조건) → review
    training_data: ["COCO 2017 (주석 CC BY 4.0, 이미지는 Flickr 개별 CC 라이선스로 CC BY-NC 계열 포함)"]
    commercial: review
  # 사람 박스 탐지, RTMPose 앞단 (prelabel.yaml models.body_detector). rtmlib 기본 Human-Art판은
  # 비상업 데이터라 쓰지 않는다 (ADR 0010)
  yolox_m_coco:
    path: data/models/yolox/yolox_m_coco.onnx
    url: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_m.onnx
    sha256: 21ff6cfdeb53b013bac2249599e55f00bff3cfdfdab37ed7a4620818c1d15b3f
    license: Apache-2.0
    # COCO 이미지는 Flickr 사진마다 다른 CC 라이선스이고 CC BY-NC 계열이 섞여 있다 (비상업 조건) → review
    training_data: ["COCO 2017 (주석 CC BY 4.0, 이미지는 Flickr 개별 CC 라이선스로 CC BY-NC 계열 포함)"]
    commercial: review
  # YOLOX-s COCO PyTorch 체크포인트: 재학습 루프 yolox 학습기의 출발 가중치 (training.yaml yolox.base_model, ADR 0062).
  # 추론에는 쓰지 않는다 (ONNX가 아니다). 학습 모델은 이 분류(review)를 물려받는다. sha256은 공식 릴리스 파일을
  # 직접 받아 계산한 값이다 (scripts/pretrain/train_yolox.py WEIGHTS_SHA256과 같다). 공개 데이터 1차 학습(ADR 0060)
  # 체크포인트를 쓰려면 그 .pth를 training_datasets·base_model(이 항목)과 함께 따로 등록하고 base_model을 바꾼다.
  yolox_s_coco_pth:
    path: data/models/yolox/yolox_s_coco.pth
    url: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_s.pth
    sha256: f55ded7181e1b0c13285c56e7790b8f0e8f8db590fe4edb37f0b7f345c913a30
    license: Apache-2.0
    training_data: ["COCO 2017 (주석 CC BY 4.0, 이미지는 Flickr 개별 CC 라이선스로 CC BY-NC 계열 포함)"]
    commercial: review
  # 전신 COCO 17점 (prelabel.yaml models.body → RtmPose). zip에서 end2end.onnx를 꺼낸다
  rtmpose_m_body7:
    path: data/models/rtmpose/rtmpose_m_body7_256x192.onnx
    url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-body7_pt-body7_420e-256x192-e48f03d0_20230504.zip
    archive_member: end2end.onnx
    sha256: f7fbb6c5c11a1bb70f3d445e4ddec5d144ea89ad5649c081ef976f9b24a0b741
    # 위 SHA256으로 검증한 ZIP에서 추출한 ONNX의 SHA256. 캐시 파일도 다시 검증한다.
    artifact_sha256: 5c0a4bf67953e6d2ac43ce15e77dc9d5d354ae18430a47d2c5963a7bc5683e3c
    license: Apache-2.0
    training_data:
      - COCO 2017 (주석 CC BY 4.0, 이미지는 Flickr 개별 CC 라이선스로 CC BY-NC 계열 포함)
      - CrowdPose (CC BY 4.0, 학술·비상업 연구용으로 배포)
      - AI Challenger, MPII, sub-JHMDB, Halpe, PoseTrack18 (연구용 배포, 조건 확인 필요)
    commercial: review
  # OWLv2 오픈 보캐뷸러리 탐지 (prelabel.yaml models.open_vocab, privacy.yaml 오픈 보캐뷸러리
  # 탐지기). 고정 리비전 URL이라 파일이 바뀌지 않는다
  owlv2_onnx:
    path: data/models/owlv2/model_quantized.onnx
    url: https://huggingface.co/Xenova/owlv2-base-patch16-ensemble/resolve/3e255bc9bf304b3358a8c1945c0a9514eefe7f10/onnx/model_quantized.onnx
    sha256: af8d6a041e4114b06eafabb03047350c7b8f136670a3f8afc7e73c5a74c2b24b
    license: Apache-2.0
    training_data:
      - WebLI 의사 라벨 (Google 내부)
      - Objects365 (비상업), Visual Genome (CC BY 4.0) 미세조정 (논문 기준)
    commercial: review
  # OWLv2 질의 토크나이저 (CLIP BPE, 학습 데이터 없음)
  owlv2_tokenizer:
    path: data/models/owlv2/tokenizer.json
    url: https://huggingface.co/Xenova/owlv2-base-patch16-ensemble/resolve/3e255bc9bf304b3358a8c1945c0a9514eefe7f10/tokenizer.json
    sha256: bbce3185c27ac4daf41ea2dfc864785bdcd1a42815e7646324af20edd671a578
    license: Apache-2.0
    training_data: []
    commercial: allowed
  # 메트릭 깊이 (prelabel.yaml models.depth → lift3d.DepthLifter). 공개 ONNX가 없어 export
  # 스크립트로 변환한다 (make export-models)
  depth_metric_indoor_small:
    path: data/models/depth_anything_v2_metric_indoor_small.onnx
    export: scripts/export_depth_onnx.py
    sha256: a27ffdfa286396ad8b7b59ef3fbbc0aa15c6a252673e068a4f2f73e3fd7eacf3
    # 같은 가중치를 공식 저장소가 depth-anything/Depth-Anything-V2-Metric-Hypersim-Small로 Apache-2.0을
    # 달아 배포한다 (변환에 쓴 -hf 저장소에는 라이선스 표시가 없다).
    license: Apache-2.0
    # 인코더(Depth Anything V2 Small)는 대규모 비라벨 실사 이미지에 Giant 교사 모델(CC BY-NC 4.0)이
    # 만든 의사 깊이로 학습했다. 그 이미지 데이터셋에는 비상업·연구용 조건이 있어 review다 (법무 확인
    # 대상). 교사 모델은 간접 계보라 적기만 하고 분류 근거로 쓰지 않는다 (ADR 0010 결정 1).
    training_data:
      - Hypersim 미세조정 (CC BY-SA 3.0)
      - 인코더 Depth Anything V2 Small (Apache-2.0)의 의사 라벨 학습 이미지
      - ImageNet-21K (비상업 연구·교육용 이용 약관)
      - SA-1B (SA-1B 데이터셋 연구용 라이선스)
      - Objects365 (비상업)
      - BDD100K, Google Landmarks v2, LSUN, Open Images, Places365 (연구용 배포, 조건 확인 필요)
      - 의사 깊이를 만든 Giant 교사 모델은 CC BY-NC 4.0
    commercial: review

  # 객체·손 모양 마스크 (prelabel.yaml models.mask_* → masks.MaskMaker, dlp_models.sam2, ADR 0059).
  # 공식 SAM 2.1 hiera-tiny(facebook/sam2.1-hiera-tiny, 모델 카드 license apache-2.0, revision de431c4)를
  # onnx-community가 영상 인코더와 프롬프트 인코더·마스크 디코더로 나눠 변환한 fp32 ONNX다 (고정 revision
  # 814a066, 변환본 카드에는 라이선스 표시가 없어 원 가중치 라이선스를 잇는 것으로 본다). 각 그래프는
  # 가중치를 같은 디렉터리의 외부 데이터 파일(*.onnx_data)에 둔다 (파일 이름을 바꾸면 열리지 않는다).
  # 라이선스 확인 (2026-10-25): facebookresearch/sam2 README "The SAM 2 model checkpoints, SAM 2 demo code
  # (front-end and back-end), and SAM 2 training code are licensed under Apache 2.0", SA-V 데이터셋
  # (sav_dataset/README.md) "released under CC BY 4.0". SAM 2 논문(arXiv 2408.00714) 학습 혼합은 SA-1B,
  # SA-V, 사내 허가 영상(Internal), 공개 VOS(DAVIS·MOSE·YouTube-VOS)다. SA-1B는 Meta 데이터셋 페이지가
  # "research purposes"용 제한 라이선스로 밝힌다 → 직접 학습 데이터에 연구용 조건이 있어 review (ADR 0010).
  sam2_tiny_encoder:
    path: data/models/sam2/vision_encoder.onnx
    url: https://huggingface.co/onnx-community/sam2.1-hiera-tiny-ONNX/resolve/814a066640debee5a91e70aa401fb8e17e030503/onnx/vision_encoder.onnx
    sha256: 4f30aacd3aaefbca81a0b7fe4c1fc96345570ea0a6f80ced599493d1b3be2e8c
    license: Apache-2.0
    training_data: &sam2_data
      - SA-1B (SA-1B 데이터셋 연구용 라이선스, research purposes)
      - SA-V (CC BY 4.0)
      - Meta 사내 허가 영상 (Internal, 공개되지 않음)
      - DAVIS, MOSE (CC BY-NC-SA 4.0), YouTube-VOS (연구용 배포, 조건 확인 필요)
    commercial: review
  # 인코더 가중치 (외부 데이터, 위 그래프가 같은 디렉터리에서 이 이름으로 읽는다)
  sam2_tiny_encoder_data:
    path: data/models/sam2/vision_encoder.onnx_data
    url: https://huggingface.co/onnx-community/sam2.1-hiera-tiny-ONNX/resolve/814a066640debee5a91e70aa401fb8e17e030503/onnx/vision_encoder.onnx_data
    sha256: e83df9866a5afe68ea7f0f721f18f65137fc3acbf0da1c74e946d363e09c69cc
    license: Apache-2.0
    training_data: *sam2_data
    commercial: review
  sam2_tiny_decoder:
    path: data/models/sam2/prompt_encoder_mask_decoder.onnx
    url: https://huggingface.co/onnx-community/sam2.1-hiera-tiny-ONNX/resolve/814a066640debee5a91e70aa401fb8e17e030503/onnx/prompt_encoder_mask_decoder.onnx
    sha256: 874414704c5d686db7d206a35f6e15d26563d50c8c4468fccc6739bd7e491dcf
    license: Apache-2.0
    training_data: *sam2_data
    commercial: review
  sam2_tiny_decoder_data:
    path: data/models/sam2/prompt_encoder_mask_decoder.onnx_data
    url: https://huggingface.co/onnx-community/sam2.1-hiera-tiny-ONNX/resolve/814a066640debee5a91e70aa401fb8e17e030503/onnx/prompt_encoder_mask_decoder.onnx_data
    sha256: e9874d900dd4134ed60eab1e97910327c2419e0b2954485d8fd6e7f1a1470f47
    license: Apache-2.0
    training_data: *sam2_data
    commercial: review

# 외부 추론 서버로 쓰는 모델 (가중치는 서버에 있다). 정책이 이름으로 가리키고 라이선스 검사를 받는다.
external:
  Qwen/Qwen2.5-VL-7B-Instruct:
    served_by: OpenAI 호환 VLM 서버 (vLLM, llama.cpp 등), config/policies/actions.yaml vlm.model
    license: Apache-2.0
    # 학습 데이터의 라이선스 조건을 확인할 수 없어 allowed로 두지 않는다 (판매 전 법무 확인 대상)
    training_data: ["공개되지 않음 (모델 카드에 학습 데이터 출처 명시 없음)"]
    commercial: review
  # ── AI 1차 검수 판정 VLM 후보 (WP17, ADR 0040). config/policies/aireview.yaml backend.model로 고른다.
  # 라이선스는 2026-10-11 Hugging Face 모델 카드(api/models/<저장소>의 cardData.license)로 확인했다
  # (괄호 안은 그때의 저장소 revision). 기본 후보는 행동 분류(Qwen2.5-VL-7B)와 다른 모델이다 (자기 검수
  # 상관 오류 방지). 최종 모델은 WP17.3 bench(DGX Spark 실측)와 WP17.8 골든 평가로 정한다.
  # 양자화·변환본(FP8, GGUF 등)은 원 가중치 라이선스를 잇는지 따로 확인하고, 실행 기록
  # backend.fingerprint와 served_model에 실제 가중치 저장소@revision을 남긴다.
  # 같은 서버(services/vlm vlm-aireview)가 설명 라벨의 한→영 번역도 맡는다 (글만 보내는 요청, ADR 0043).
  # 번역 결과(영어 설명 라벨)도 판매 데이터에 들어가므로 같은 상업 사용 판단(review)을 따른다.
  Qwen/Qwen3-VL-8B-Instruct:          # 기본 판정 모델 (revision 0c351dd)
    served_by: 사내 OpenAI 호환 VLM 서버 (DGX Spark vLLM), config/policies/aireview.yaml backend.model, config/policies/translate.yaml backend.model
    license: Apache-2.0
    training_data: ["공개되지 않음 (모델 카드에 학습 데이터 출처 명시 없음)"]
    commercial: review
  Qwen/Qwen3-VL-30B-A3B-Instruct:     # MoE 후보 (총 30B, 활성 약 3B; revision 9c4b90e)
    served_by: 사내 OpenAI 호환 VLM 서버 (DGX Spark vLLM), config/policies/aireview.yaml backend.model
    license: Apache-2.0
    training_data: ["공개되지 않음 (모델 카드에 학습 데이터 출처 명시 없음)"]
    commercial: review
  Qwen/Qwen2.5-VL-32B-Instruct:       # 큰 밀집 모델 후보 (revision 7cfb30d)
    served_by: 사내 OpenAI 호환 VLM 서버 (DGX Spark vLLM), config/policies/aireview.yaml backend.model
    license: Apache-2.0
    training_data: ["공개되지 않음 (모델 카드에 학습 데이터 출처 명시 없음)"]
    commercial: review
  mistralai/Mistral-Small-3.2-24B-Instruct-2506:   # 다른 계열 후보 (revision 95a6d26)
    served_by: 사내 OpenAI 호환 VLM 서버 (DGX Spark vLLM), config/policies/aireview.yaml backend.model
    license: Apache-2.0
    training_data: ["공개되지 않음 (모델 카드에 학습 데이터 출처 명시 없음)"]
    commercial: review
