# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 물리 유형 (객체의 physical_type).
# 주의: 프리라벨 접촉 단계가 person을 코드에서 직접 쓴다 (이 유형 박스와의 접촉은 부위를 몰라 손 상태를
# 만들지 않는다, dlp_prelabel.runner.PERSON_PHYSICAL_TYPE). 이름을 바꾸면 코드도 바꾼다.
physical_types:
  rigid: {ko: 강체, en: Rigid}
  articulated: {ko: 관절체, en: Articulated}
  deformable: {ko: 변형체, en: Deformable}
  fluid_powder: {ko: 액체·분말, en: Liquid or powder}
  person: {ko: 사람, en: Person}

# 객체 상태 속성: values는 허용 값 ID (2개 이상). object_state 라벨과 행동의 pre/post_state가 쓴다.
state_attributes:
  open_state: {ko: 열림 상태, en: Open state, values: [open, closed]}
  fold_state: {ko: 접힘 상태, en: Fold state, values: [unfolded, folded]}
  cleanliness: {ko: 청결 상태, en: Cleanliness, values: [dirty, clean]}
  fill_state: {ko: 채움 상태, en: Fill level, values: [full, partial, empty]}
  worn_state: {ko: 착용 상태, en: Worn state, values: [worn, not_worn]}
  wetness: {ko: 젖음 상태, en: Wetness, values: [wet, dry]}

# 초기 목록 (provisional). 파일럿 영상의 출현 빈도로 v1을 확정한다.
# tool: 작용부(working_parts)와 파지부(grip_parts)를 가진 도구
# surface: 처리 대상 표면 (청결 상태와 커버리지 기록 대상)
# physical_priors: 물리 사전값 (ADR 0049, 2026-10-17 덧붙임). 측정값이 아니라 클래스의 흔한 실물을 넓게 잡은
#   추정 범위(source: prior_estimate)이고, 사람(전문가)이 수치를 검토해야 한다 (F-SCH-16).
#   material·tactile은 physics.yaml 어휘. 도구의 촉감·마찰은 파지부, 그 밖은 주로 닿는 면 기준이다.
#   mass_kg: kg. static_friction: 정지 마찰 계수(무차원), 상대면은 건조한 맨손 피부·니트릴 장갑·고무
#   그리퍼 패드를 함께 보는 넓은 범위다. by_state: 그 객체 states의 상태 값별 범위 (젖음은 wetness).
#   고정 설비·표면(바닥·벽·세면대 등)은 질량을 적지 않는다. person은 적지 않는다.
objects:
  mop: {ko: 밀대, en: Mop, physical_type: rigid, states: [wetness, cleanliness], tool: {working_parts: [mop_head], grip_parts: [handle]},
    physical_priors: {source: prior_estimate, material: metal, part_materials: {mop_head: fabric}, tactile: [hard, smooth],
      mass_kg: {min: 0.5, max: 2.5, by_state: {wetness: {wet: {min: 0.8, max: 3.5}}}},
      static_friction: {min: 0.3, max: 0.8, by_state: {wetness: {wet: {min: 0.15, max: 0.6}}}}, note: "손잡이는 알루미늄·플라스틱 막대 가정"}}
  rag: {ko: 걸레, en: Cleaning cloth, physical_type: deformable, states: [wetness, cleanliness, fold_state], tool: {working_parts: [cloth_face], grip_parts: [cloth_body]},
    physical_priors: {source: prior_estimate, material: fabric, tactile: [soft, absorbent, fibrous],
      mass_kg: {min: 0.02, max: 0.3, by_state: {wetness: {wet: {min: 0.05, max: 0.9}}}}, static_friction: {min: 0.4, max: 1.0}}}
  sponge: {ko: 스펀지, en: Sponge, physical_type: deformable, states: [wetness], tool: {working_parts: [sponge_face], grip_parts: [sponge_body]},
    physical_priors: {source: prior_estimate, material: polyurethane_foam, tactile: [soft, elastic, absorbent],
      mass_kg: {min: 0.005, max: 0.06, by_state: {wetness: {wet: {min: 0.02, max: 0.4}}}}, static_friction: {min: 0.5, max: 1.2}}}
  brush: {ko: 솔, en: Scrub brush, physical_type: rigid, states: [wetness], tool: {working_parts: [bristles], grip_parts: [handle]},
    physical_priors: {source: prior_estimate, material: plastic, tactile: [hard, smooth], mass_kg: {min: 0.05, max: 0.5},
      static_friction: {min: 0.3, max: 0.8, by_state: {wetness: {wet: {min: 0.15, max: 0.6}}}}}}
  toilet_brush: {ko: 변기솔, en: Toilet brush, physical_type: rigid, states: [wetness], tool: {working_parts: [bristles], grip_parts: [handle]},
    physical_priors: {source: prior_estimate, material: plastic, tactile: [hard, smooth], mass_kg: {min: 0.08, max: 0.4},
      static_friction: {min: 0.3, max: 0.8, by_state: {wetness: {wet: {min: 0.15, max: 0.6}}}}}}
  broom: {ko: 빗자루, en: Broom, physical_type: rigid, states: [], tool: {working_parts: [bristles], grip_parts: [handle]},
    physical_priors: {source: prior_estimate, material: plastic, tactile: [hard, smooth], mass_kg: {min: 0.3, max: 1.5},
      static_friction: {min: 0.3, max: 0.8}, note: "플라스틱 솔과 막대 가정 (수수비는 더 가볍고 거칢)"}}
  dustpan: {ko: 쓰레받기, en: Dustpan, physical_type: rigid, states: [fill_state], tool: {working_parts: [pan_edge], grip_parts: [handle]},
    physical_priors: {source: prior_estimate, material: plastic, part_materials: {pan_edge: rubber}, tactile: [hard, smooth],
      mass_kg: {min: 0.1, max: 3.0, by_state: {fill_state: {full: {min: 0.3, max: 3.0}, partial: {min: 0.15, max: 2.0}, empty: {min: 0.1, max: 0.8}}}},
      static_friction: {min: 0.3, max: 0.8}}}
  spray_bottle: {ko: 분무기, en: Spray bottle, physical_type: rigid, states: [fill_state], tool: {working_parts: [nozzle], grip_parts: [trigger_grip]},
    physical_priors: {source: prior_estimate, material: plastic, tactile: [hard, smooth],
      mass_kg: {min: 0.04, max: 1.2, by_state: {fill_state: {full: {min: 0.3, max: 1.2}, partial: {min: 0.08, max: 1.0}, empty: {min: 0.04, max: 0.15}}}},
      static_friction: {min: 0.3, max: 0.7}, note: "용량 0.3~1 L 가정"}}
  bucket: {ko: 양동이, en: Bucket, physical_type: rigid, states: [fill_state],
    physical_priors: {source: prior_estimate, material: plastic, tactile: [hard, smooth],
      mass_kg: {min: 0.3, max: 16.0, by_state: {fill_state: {full: {min: 5.0, max: 16.0}, partial: {min: 1.0, max: 10.0}, empty: {min: 0.3, max: 1.5}}}},
      static_friction: {min: 0.3, max: 0.7}, note: "용량 5~15 L 물 가정"}}
  trash_bag: {ko: 쓰레기봉투, en: Trash bag, physical_type: deformable, states: [fill_state, open_state],
    physical_priors: {source: prior_estimate, material: plastic, tactile: [soft, smooth, slippery],
      mass_kg: {min: 0.005, max: 15.0, by_state: {fill_state: {full: {min: 1.0, max: 15.0}, partial: {min: 0.1, max: 8.0}, empty: {min: 0.005, max: 0.05}}}},
      static_friction: {min: 0.2, max: 0.6}}}
  trash_bin: {ko: 쓰레기통, en: Trash bin, physical_type: articulated, states: [fill_state, open_state],
