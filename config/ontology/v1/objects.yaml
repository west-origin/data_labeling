      static_friction: {min: 0.4, max: 0.9}}}
  towel: {ko: 수건, en: Towel, physical_type: deformable, states: [fold_state, wetness],
    physical_priors: {source: prior_estimate, material: fabric, tactile: [soft, absorbent, fibrous],
      mass_kg: {min: 0.05, max: 1.0, by_state: {wetness: {wet: {min: 0.15, max: 3.0}}}}, static_friction: {min: 0.4, max: 1.0}}}
  cup: {ko: 컵, en: Cup, physical_type: rigid, states: [fill_state],
