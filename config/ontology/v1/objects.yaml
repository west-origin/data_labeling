      mass_kg: {min: 0.5, max: 25.0, by_state: {fill_state: {full: {min: 2.0, max: 25.0}, partial: {min: 0.8, max: 15.0}, empty: {min: 0.5, max: 5.0}}}},
      static_friction: {min: 0.3, max: 0.7}}}
  bedsheet: {ko: 시트, en: Bed sheet, physical_type: deformable, states: [fold_state, cleanliness],
    physical_priors: {source: prior_estimate, material: fabric, tactile: [soft, fibrous], mass_kg: {min: 0.3, max: 1.5},
      static_friction: {min: 0.4, max: 0.9}}}
  pillow: {ko: 베개, en: Pillow, physical_type: deformable, states: [],
