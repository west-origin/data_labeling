# 표면 부분: 표면 평면을 정하는 꼭짓점 3D 궤적(trajectory3d)의 part ID.
# corner_0 원점, corner_1 가로 끝, corner_2 대각, corner_3 세로 끝 (relations.yaml tool_surface.corner_parts)
surface_parts:
  corner_0: {ko: 꼭짓점 0 (원점), en: Corner 0 (origin)}
  corner_1: {ko: 꼭짓점 1 (가로 끝), en: Corner 1 (horizontal end)}
  corner_2: {ko: 꼭짓점 2 (대각), en: Corner 2 (diagonal)}
  corner_3: {ko: 꼭짓점 3 (세로 끝), en: Corner 3 (vertical end)}
