# form: point(시점) | interval(구간). severity: 심각도(1~3) 필수 여부.
events:
  grasp_failure: {category: failure_retry, ko: 파지 실패, form: point, requires_action: true}
  drop: {category: failure_retry, ko: 물체 놓침·낙하, form: point, requires_action: true}
  regrasp: {category: failure_retry, ko: 재파지, form: point, requires_action: true}
  action_retry: {category: failure_retry, ko: 행동 재시도, form: interval, requires_action: true}
  step_abort: {category: failure_retry, ko: 단계 중단, form: point, requires_action: true}
  rework_missed_area: {category: failure_retry, ko: 미처리 영역 재작업, form: interval, requires_action: true}
  slip: {category: worker_safety, ko: 미끄러짐, form: interval, severity: true}
  collision: {category: worker_safety, ko: 충돌, form: interval, severity: true}
  sharp_contact: {category: worker_safety, ko: 날카로운 물체 접촉, form: interval, severity: true}
