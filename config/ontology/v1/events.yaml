# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko는 사람용 이름.
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 이벤트 유형 (event 라벨의 event_type).
#   category: failure_retry(실패·재시도) | worker_safety(작업자 안전) | subject_safety(대상자 안전)
#             | infection_control(감염 관리)
#   requires_action: 라벨에 related_action_id(관련 행동) 필수. requires_object: related_entity_id 필수.
#   raw_access: 원본 접근 권한자만 기록 (표정 등 블러본으로는 판단할 수 없는 이벤트).
# form: point(시점) | interval(구간). severity: 심각도(1~3) 필수 여부.
events:
  grasp_failure: {category: failure_retry, ko: 파지 실패, form: point, requires_action: true}
  drop: {category: failure_retry, ko: 물체 놓침·낙하, form: point, requires_action: true}
  regrasp: {category: failure_retry, ko: 재파지, form: point, requires_action: true}
  action_retry: {category: failure_retry, ko: 행동 재시도, form: interval, requires_action: true}
  step_abort: {category: failure_retry, ko: 단계 중단, form: point, requires_action: true}
  rework_missed_area: {category: failure_retry, ko: 미처리 영역 재작업, form: interval, requires_action: true}
  slip: {category: worker_safety, ko: 미끄러짐, form: interval, severity: true}
  collision: {category: worker_safety, ko: 충돌, form: interval, severity: true}
  sharp_contact: {category: worker_safety, ko: 날카로운 물체 접촉, form: interval, severity: true}
  loss_of_balance: {category: subject_safety, ko: 균형 상실, form: interval, severity: true}
  fall_risk: {category: subject_safety, ko: 낙상 위험, form: interval, severity: true}
  discomfort: {category: subject_safety, ko: 불편 반응, form: interval, severity: true, raw_access: true}
  bare_hand_contamination: {category: infection_control, ko: 장갑 미착용 체액·오염물 접촉, form: point, requires_object: true}
  cross_contamination_hand: {category: infection_control, ko: 오염 후 청결 표면 접촉, form: point, requires_object: true}
  cross_contamination_tool: {category: infection_control, ko: 오염 도구로 청결 표면 접촉, form: point, requires_object: true}
