  discomfort: {category: subject_safety, ko: 불편 반응, form: interval, severity: true, raw_access: true}
  bare_hand_contamination: {category: infection_control, ko: 장갑 미착용 체액·오염물 접촉, form: point, requires_object: true}
  cross_contamination_hand: {category: infection_control, ko: 오염 후 청결 표면 접촉, form: point, requires_object: true}
  cross_contamination_tool: {category: infection_control, ko: 오염 도구로 청결 표면 접촉, form: point, requires_object: true}
