# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 도메인: ko(이름), phase(기준 문서 로드맵 도입 단계 A/B/C). 키는 dlp_schema.session.Domain 열거형과 같아야 한다.
domains:
  cleaning: {ko: 청소, en: Cleaning, phase: A}
  caregiving: {ko: 요양돌봄, en: Caregiving, phase: B}
  nursing: {ko: 간호, en: Nursing, phase: C}

# 작업: domain(위 도메인 키), ko. substeps(하위 단계 ID → {ko})를 둘 수 있다 (ID는 작업 사이에서도 고유).
# 작업은 상위 구간(segment level=task)의 ref_id, 하위 단계는 segment level=substep의 ref_id로 쓴다.
# 하위 단계(substeps)는 현장 전문가 구술 후 채운다.
tasks:
  floor_sweep_mop: {domain: cleaning, ko: 바닥 쓸기·닦기, en: Floor sweeping and mopping}
  surface_wipe_disinfect: {domain: cleaning, ko: 표면 닦기·소독, en: Surface wiping and disinfection}
  toilet_cleaning: {domain: cleaning, ko: 화장실 청소, en: Toilet cleaning}
  bed_making: {domain: cleaning, ko: 침상 정리·시트 교체, en: Bed making and sheet change}
  waste_collection: {domain: cleaning, ko: 쓰레기 수거·분리, en: Waste collection and sorting}
  repositioning: {domain: caregiving, ko: 체위 변경, en: Repositioning}
  transfer_assist: {domain: caregiving, ko: 이승 보조(침대↔휠체어), en: "Transfer assistance (bed <-> wheelchair)"}
  feeding_assist: {domain: caregiving, ko: 식사 보조, en: Feeding assistance}
  oral_hygiene: {domain: caregiving, ko: 구강 위생, en: Oral hygiene}
  diaper_change: {domain: caregiving, ko: 기저귀 교체, en: Diaper change}
  bathing_assist: {domain: caregiving, ko: 세면·목욕 보조, en: Washing and bathing assistance}
  dressing_assist: {domain: caregiving, ko: 옷 입히고 벗기기, en: Dressing and undressing assistance}
  vital_signs: {domain: nursing, ko: 활력징후 측정, en: Vital signs measurement}
  medication: {domain: nursing, ko: 투약 준비·투약, en: Medication preparation and administration}
  blood_glucose: {domain: nursing, ko: 혈당 측정, en: Blood glucose measurement}
  dressing_change: {domain: nursing, ko: 드레싱 교체, en: Wound dressing change}
  hand_hygiene_ppe: {domain: nursing, ko: 손 위생·보호구 착용, en: Hand hygiene and PPE donning}
