# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 동사. 행동(action) 라벨의 verb는 primitive만 쓴다. skill·human_skill은 상위 구간(segment level=skill)의 ref_id.
# contactless: true면 접촉 없이 하는 동사 (그 행동 라벨에는 접촉 시작 시각 t_contact_start_ms가 있으면 안 된다).
# level: primitive(원시 동작, 라벨 단위) | skill(기술) | human_skill(사람 대상 기술, Phase B부터)
verbs:
  grasp: {level: primitive, ko: 잡다, en: grasp}
  release: {level: primitive, ko: 놓다, en: release}
  lift: {level: primitive, ko: 들어 올리다, en: lift}
  lower: {level: primitive, ko: 내리다, en: lower}
  carry: {level: primitive, ko: 옮기다, en: carry}
  push: {level: primitive, ko: 밀다, en: push}
  pull: {level: primitive, ko: 당기다, en: pull}
  rotate: {level: primitive, ko: 돌리다, en: rotate}
  press: {level: primitive, ko: 누르다, en: press}
  rub: {level: primitive, ko: 문지르다, en: rub}
  support: {level: primitive, ko: 지지하다, en: support}

  open: {level: skill, ko: 열다, en: open}
  close: {level: skill, ko: 닫다, en: close}
  wipe: {level: skill, ko: 닦다, en: wipe}
  sweep: {level: skill, ko: 쓸다, en: sweep}
  rinse: {level: skill, ko: 헹구다, en: rinse}
  wring: {level: skill, ko: 짜다, en: wring out}
  spray: {level: skill, ko: 뿌리다, en: spray}
  pour: {level: skill, ko: 붓다, en: pour}
  spread: {level: skill, ko: 펴다, en: spread out}
  fold: {level: skill, ko: 접다, en: fold}
  wrap: {level: skill, ko: 감싸다, en: wrap}
  attach: {level: skill, ko: 붙이다, en: attach}
  detach: {level: skill, ko: 떼다, en: detach}
  insert: {level: skill, ko: 끼우다, en: insert}
  remove: {level: skill, ko: 빼다, en: remove}
  measure: {level: skill, ko: 측정하다, en: measure}
  inspect: {level: skill, ko: 확인하다, en: inspect, contactless: true}

  roll_person: {level: human_skill, ko: 굴리다, en: roll (a person)}
  raise_person: {level: human_skill, ko: 일으키다, en: help up (a person)}
  lay_down_person: {level: human_skill, ko: 눕히다, en: lay down (a person)}
  lift_transfer_person: {level: human_skill, ko: 들어 옮기다, en: lift and transfer (a person)}
  dress_person: {level: human_skill, ko: 입히다, en: dress (a person)}
  undress_person: {level: human_skill, ko: 벗기다, en: undress (a person)}

# 행동 사이 구간을 채우는 값. 타임라인에 공백을 두지 않는다.
gap_types:
  idle: {ko: 대기, en: Idle, description: 의도적 정지}
  unknown: {ko: 미상, en: Unknown, description: 무엇인지 판단할 수 없음. 온톨로지 확장 후보로 검토}
  out_of_scope: {ko: 범위 외, en: Out of scope, description: "대화, 기록 작성 등 조작이 아닌 활동"}
