# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko는 사람용 이름.
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 동사. 행동(action) 라벨의 verb는 primitive만 쓴다. skill·human_skill은 상위 구간(segment level=skill)의 ref_id.
# contactless: true면 접촉 없이 하는 동사 (그 행동 라벨에는 접촉 시작 시각 t_contact_start_ms가 있으면 안 된다).
# level: primitive(원시 동작, 라벨 단위) | skill(기술) | human_skill(사람 대상 기술, Phase B부터)
verbs:
  grasp: {level: primitive, ko: 잡다}
  release: {level: primitive, ko: 놓다}
  lift: {level: primitive, ko: 들어 올리다}
  lower: {level: primitive, ko: 내리다}
  carry: {level: primitive, ko: 옮기다}
  push: {level: primitive, ko: 밀다}
  pull: {level: primitive, ko: 당기다}
  rotate: {level: primitive, ko: 돌리다}
  press: {level: primitive, ko: 누르다}
  rub: {level: primitive, ko: 문지르다}
  support: {level: primitive, ko: 지지하다}

  open: {level: skill, ko: 열다}
  close: {level: skill, ko: 닫다}
  wipe: {level: skill, ko: 닦다}
  sweep: {level: skill, ko: 쓸다}
  rinse: {level: skill, ko: 헹구다}
  wring: {level: skill, ko: 짜다}
  spray: {level: skill, ko: 뿌리다}
  pour: {level: skill, ko: 붓다}
  spread: {level: skill, ko: 펴다}
  fold: {level: skill, ko: 접다}
  wrap: {level: skill, ko: 감싸다}
  attach: {level: skill, ko: 붙이다}
  detach: {level: skill, ko: 떼다}
  insert: {level: skill, ko: 끼우다}
  remove: {level: skill, ko: 빼다}
  measure: {level: skill, ko: 측정하다}
  inspect: {level: skill, ko: 확인하다, contactless: true}

  roll_person: {level: human_skill, ko: 굴리다}
  raise_person: {level: human_skill, ko: 일으키다}
  lay_down_person: {level: human_skill, ko: 눕히다}
  lift_transfer_person: {level: human_skill, ko: 들어 옮기다}
  dress_person: {level: human_skill, ko: 입히다}
  undress_person: {level: human_skill, ko: 벗기다}

# 행동 사이 구간을 채우는 값. 타임라인에 공백을 두지 않는다.
gap_types:
  idle: {ko: 대기, description: 의도적 정지}
  unknown: {ko: 미상, description: 무엇인지 판단할 수 없음. 온톨로지 확장 후보로 검토}
  out_of_scope: {ko: 범위 외, description: "대화, 기록 작성 등 조작이 아닌 활동"}
