# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko는 사람용 이름.
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# body_parts: hand_state.body_part, action.target_body_part가 쓴다 (돌봄 대상자의 부위, 좌우는 대상자 기준).
# 대상자 신체 부위 26개. 민감 부위는 둔부 범주로 기록하고 더 세분하지 않는다.
body_parts:
  head: {ko: 머리}
  neck: {ko: 목}
  chest: {ko: 가슴}
  abdomen: {ko: 복부}
  upper_back: {ko: 등 상부}
  lower_back: {ko: 허리}
  left_shoulder: {ko: 좌 어깨}
  right_shoulder: {ko: 우 어깨}
  left_upper_arm: {ko: 좌 상완}
  right_upper_arm: {ko: 우 상완}
  left_elbow: {ko: 좌 팔꿈치}
  right_elbow: {ko: 우 팔꿈치}
  left_forearm: {ko: 좌 전완}
  right_forearm: {ko: 우 전완}
  left_hand: {ko: 좌 손}
  right_hand: {ko: 우 손}
  left_buttock: {ko: 좌 둔부}
  right_buttock: {ko: 우 둔부}
  left_thigh: {ko: 좌 대퇴}
  right_thigh: {ko: 우 대퇴}
  left_knee: {ko: 좌 무릎}
  right_knee: {ko: 우 무릎}
  left_lower_leg: {ko: 좌 하퇴}
  right_lower_leg: {ko: 우 하퇴}
  left_foot: {ko: 좌 발}
  right_foot: {ko: 우 발}

# 대상자 자세 (현재 라벨 페이로드에서 직접 참조하지 않는 사전, 이후 확장용).
postures:
  supine: {ko: 앙와위}
  left_lateral: {ko: 좌측와위}
  right_lateral: {ko: 우측와위}
  prone: {ko: 복와위}
  semi_fowler: {ko: 반좌위}
  sitting_bed: {ko: 좌위(침대)}
  sitting_chair: {ko: 좌위(휠체어·의자)}
  standing: {ko: 입위}
  walking: {ko: 보행 중}
