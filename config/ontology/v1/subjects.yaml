# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# body_parts: hand_state.body_part, action.target_body_part가 쓴다 (돌봄 대상자의 부위, 좌우는 대상자 기준).
# 대상자 신체 부위 26개. 민감 부위는 둔부 범주로 기록하고 더 세분하지 않는다.
body_parts:
  head: {ko: 머리, en: Head}
  neck: {ko: 목, en: Neck}
  chest: {ko: 가슴, en: Chest}
  abdomen: {ko: 복부, en: Abdomen}
  upper_back: {ko: 등 상부, en: Upper back}
  lower_back: {ko: 허리, en: Lower back}
  left_shoulder: {ko: 좌 어깨, en: Left shoulder}
  right_shoulder: {ko: 우 어깨, en: Right shoulder}
  left_upper_arm: {ko: 좌 상완, en: Left upper arm}
  right_upper_arm: {ko: 우 상완, en: Right upper arm}
  left_elbow: {ko: 좌 팔꿈치, en: Left elbow}
  right_elbow: {ko: 우 팔꿈치, en: Right elbow}
  left_forearm: {ko: 좌 전완, en: Left forearm}
  right_forearm: {ko: 우 전완, en: Right forearm}
  left_hand: {ko: 좌 손, en: Left hand}
  right_hand: {ko: 우 손, en: Right hand}
  left_buttock: {ko: 좌 둔부, en: Left buttock}
  right_buttock: {ko: 우 둔부, en: Right buttock}
  left_thigh: {ko: 좌 대퇴, en: Left thigh}
  right_thigh: {ko: 우 대퇴, en: Right thigh}
  left_knee: {ko: 좌 무릎, en: Left knee}
  right_knee: {ko: 우 무릎, en: Right knee}
  left_lower_leg: {ko: 좌 하퇴, en: Left lower leg}
  right_lower_leg: {ko: 우 하퇴, en: Right lower leg}
  left_foot: {ko: 좌 발, en: Left foot}
  right_foot: {ko: 우 발, en: Right foot}

# 대상자 자세 (현재 라벨 페이로드에서 직접 참조하지 않는 사전, 이후 확장용).
postures:
  supine: {ko: 앙와위, en: Supine}
  left_lateral: {ko: 좌측와위, en: Left lateral (lying on left side)}
  right_lateral: {ko: 우측와위, en: Right lateral (lying on right side)}
  prone: {ko: 복와위, en: Prone}
  semi_fowler: {ko: 반좌위, en: "Semi-Fowler's position"}
  sitting_bed: {ko: 좌위(침대), en: Sitting (in bed)}
  sitting_chair: {ko: 좌위(휠체어·의자), en: Sitting (wheelchair or chair)}
  standing: {ko: 입위, en: Standing}
  walking: {ko: 보행 중, en: Walking}
