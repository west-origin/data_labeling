# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 프라이버시(블러) 대상 (blur_track 라벨의 target). 실제 탐지 대상·탐지기 설정은 config/policies/privacy.yaml이 정한다.
# required: v1 필수 블러 대상. false는 확장 후보 (확정하면 config/defaults.yaml privacy.extra_targets_v1에 적는다.
# 다만 현재 코드는 그 값을 읽지 않으므로 실제 탐지는 config/policies/privacy.yaml의 대상 목록을 바꿔야 켜진다).
privacy_targets:
  face: {ko: 얼굴, en: Face, required: true}
  reflection: {ko: 반사면 속 얼굴·사람, en: Face or person in a reflection, required: true}
  shipping_label: {ko: 택배 송장, en: Shipping label, required: true}
  document: {ko: 문서·우편물, en: Document or mail, required: true}
  screen: {ko: 켜진 화면, en: Screen (turned on), required: true}
  photo: {ko: 사진물, en: Photograph, required: true}
  address_sign: {ko: "주소 식별 정보(문패, 호실 번호)", en: "Address identifier (door plate, room number)", required: true}
  medicine_bag: {ko: 약봉투, en: Medication envelope, required: false}
  patient_wristband: {ko: 환자 팔찌, en: Patient wristband, required: false}
  bed_nameplate: {ko: 침상 명패, en: Bed nameplate, required: false}
  medical_chart: {ko: 의료 차트·모니터, en: Medical chart or monitor, required: false}
  name_tag: {ko: 명찰, en: Name tag, required: false}
  memo: {ko: 메모, en: Memo, required: false}
