# 온톨로지 v1 사전 파일 (dlp_schema.ontology.load_ontology가 이 디렉터리의 *.yaml을 합친다).
# 최상위 키는 파일 사이에서 겹치면 안 된다. 키(ID)는 소문자 snake_case(OntologyId), ko·en은 사람용 한·영 이름
# (둘 다 필수, 빈칸 금지, ADR 0043. 라벨에는 ID만 저장하고 이름은 화면·내보내기·번역 용어집에 쓴다).
# DB 등록(`dlp ontology register 1.0.0`)은 파싱된 값으로 비교하므로 주석 변경은 등록 내용에 영향이 없다.
# ID를 지우거나 바꾸거나 값을 바꾸면 새 온톨로지 버전 + 이관 표(config/ontology/migrations/)가 필요하다.
# 초안(draft)에서는 새 ID를 덧붙이는 것만 같은 버전으로 허용된다 (ADR 0028).

# 손 상태(hand_state)의 접촉 대상 종류. none이면 target_id·body_part·grasp_type을 비우고,
# object·tool·fixed_surface는 target_id, person은 body_part가 필수다 (dlp_schema.labels.HandStatePayload).
# 주의: 이 검증 규칙이 키 이름(none, object, tool, fixed_surface, person)을 코드에서 직접 쓴다. 이름을 바꾸면 코드도 바꾼다.
contact_target_kinds:
  none: {ko: 없음, en: None}
  object: {ko: 객체, en: Object}
  tool: {ko: 도구, en: Tool}
  person: {ko: 대상자, en: Care recipient}
  fixed_surface: {ko: 고정 표면, en: Fixed surface}
  self: {ko: 자기 몸, en: Own body}

# 파지 유형 (hand_state.grasp_type, 접촉이 없으면 비운다).
grasp_types:
  power: {ko: 전체 손 쥐기, en: Power grasp (whole hand)}
  precision_pinch: {ko: 손가락 끝 집기, en: Precision pinch (fingertips)}
  lateral_pinch: {ko: 옆면 집기, en: Lateral pinch}
  hook: {ko: 갈고리 걸기, en: Hook grip}
  palm_support: {ko: 손바닥 지지, en: Palm support}
  palm_push_wipe: {ko: 손바닥 밀기·닦기, en: Palm push or wipe}
  tool_grip: {ko: 도구 쥐기, en: Tool grip}
  non_prehensile: {ko: 비파지 접촉, en: Non-prehensile contact}

# 손 역할 (hand_state.role): 주동 / 보조·고정 / 비활동.
hand_roles:
  active: {ko: 주동, en: Active}
  assist: {ko: 보조·고정, en: Assisting or stabilizing}
  inactive: {ko: 비활동, en: Inactive}

# 손 관절: 손 3D 궤적(trajectory3d)의 part ID (hand21 골격의 이름 붙은 점)
hand_joints:
  wrist: {ko: 손목, en: Wrist}
  thumb_tip: {ko: 엄지 끝, en: Thumb tip}
  index_tip: {ko: 검지 끝, en: Index fingertip}
  middle_tip: {ko: 중지 끝, en: Middle fingertip}
  ring_tip: {ko: 약지 끝, en: Ring fingertip}
  pinky_tip: {ko: 소지 끝, en: Little fingertip}

# 착용자 팔 관절: 팔 3D 궤적(trajectory3d, entity `<left|right>_arm`)의 part ID (ADR 0058).
# 2D는 arm3 골격(손목·팔꿈치·어깨)이고, 손목 3D는 손 궤적(`<left|right>_hand`의 wrist)을 쓴다.
# 가슴 장착 1인칭에서 어깨는 거의 화면에 없어 프리라벨은 보이지 않음(0)으로 둔다 (검수자가 보이면 찍는다).
arm_joints:
  elbow: {ko: 팔꿈치, en: Elbow}
  shoulder: {ko: 어깨, en: Shoulder}
