# 청소 전후 다각도 사진의 3D 복원·물체 이동 비교와 장면 안 바디캠 위치 추정 정책 (dlp scene3d, ADR 0066·0067).
# 읽는 곳: dlp_scene3d.policy.load_policy. 각 절의 해시가 그 단계 결과의 모델 버전에 들어간다
# (절을 바꾸면 그 단계부터 다시 계산한다. 이전 결과는 지우지 않고 새 버전 키로 쓴다).
# 맨 아래 interpolation 절만 예외다: 위치 기록을 읽을 때만 쓰므로 바꿔도 아무것도 다시 계산하지 않는다.
version: 1

# 사진 수집 (dlp scene3d ingest). 원본은 원본 버킷에 그대로(불변) 두고 EXIF 방향은 읽을 때 적용한다.
capture:
  extensions: [".jpg", ".jpeg", ".png"]
  min_photos: 8                  # 한 단계(청소 전·후) 사진이 이보다 적으면 수집을 거부한다 (복원 불가)
  max_photos: 400

# 복원 (dlp scene3d reconstruct). 입력은 승인된 블러 사진뿐이다.
reconstruction:
  # 카메라 자세: pycolmap(실제, 격리 환경) | unavailable. 정답을 아는 stub(oracle)은 정책이 아니라
  # 테스트·--oracle로만 끼운다.
  # TODO(real-model): pycolmap 연동은 격리 환경(scripts/gsplat-env)에서 실측 전이다.
  sfm: pycolmap
  # 스플랫: gsplat(실제, GPU 격리 환경) | init_points(SfM 점으로 초기화한 가우시안만, CPU stub).
  # TODO(real-model): gsplat 학습은 GPU 서버에서 실측 전이다.
  splat: gsplat
  sfm_tool: colmap               # config/models.yaml external 이름 (라이선스 검사 대상)
  splat_tool: gsplat
  min_registered_ratio: 0.7      # 자세를 찾은 사진 비율이 이보다 낮으면 복원을 실패로 본다
  splat_iterations: 7000
  init_scale: 0.01               # init_points 가우시안 초기 크기 (장면 단위)
  # 미터 척도 (ADR 0067). SfM만으로는 척도를 모른다. SfM 뒤, 스플랫 학습 전에 승인된 블러 사진에서 크기를 아는
  # ArUco 마커의 모서리를 찾아(cv2.aruco) SfM 카메라로 삼각측량하고, 척도 = side_m / 복원 단위 변 길이를
  # 카메라 이동·희소 점에 곱한다. 마커가 없거나 추정이 불안정하면 척도를 지어내지 않는다: metric=False로 두고
  # 이유를 복원 기록(scale.reason)에 남긴다. 마커는 평평한 곳에 붙이고 전·후 각각 여러 각도에서 찍는다
  # (전과 후의 자리는 달라도 된다). 블러 검수자는 마커 위에 생긴 블러 상자를 지운다 (가려지면 읽지 못한다).
  # 아래 값은 합성 사진으로만 맞춘 것이다 (실사진 실측 전).
  marker:
    enabled: true
    dictionary: DICT_4X4_50      # cv2.aruco 사전 이름. 현장에 나눠 준 인쇄물과 같아야 한다
    side_m: 0.16                 # 검은 테두리 바깥 한 변의 실제 길이 (m, A4 인쇄 가정). 인쇄물을 자로 재서 맞춘다
    ids: []                      # 받을 마커 ID (비우면 그 사전의 모든 ID). 한 공간에 같은 ID를 두 장 두지 않는다
    corner_refinement: apriltag  # 모서리 다듬기: apriltag(변에 직선을 맞춘다) | subpix(모서리 부화소, 작은 마커는 안쪽으로 치우친다)
    min_photos: 3                # 한 마커를 자세를 찾은 사진 이만큼보다 적게 봤으면 그 마커는 쓰지 않는다 (2 이상)
    max_corner_error: 0.05       # 다시 투영한 모서리가 그 사진 속 마커 한 변(화소)의 이 비율보다 멀면 그 사진을 뺀다
    min_parallax_deg: 5.0        # 마커를 본 시선들 사이의 가장 큰 각이 이보다 작으면 쓰지 않는다 (깊이가 정해지지 않는다)
    max_side_spread: 0.05        # 변 길이 추정들의 (최대 - 최소) / 중앙값이 이보다 크면 척도를 정하지 않는다
    metric_check_tolerance: 0.05 # 이미 미터인 SfM 결과(정답 stub)와 마커 배율이 이 비율보다 다르면 복원을 거부한다

# after → before 정렬. 고정 구조(벽·가구)의 3D 점 대응으로 닮음 변환(척도 포함)을 RANSAC으로 찾는다.
alignment:
  descriptor_ratio: 0.8          # 기술자 최근접 비율 검사 (낮을수록 엄격)
  inlier_threshold_m: 0.03       # 변환 뒤 점 거리가 이 이내면 정렬 내점 (before 단위)
  ransac_iterations: 500
  seed: 0
  min_inliers: 12                # 아래 셋 중 하나라도 못 미치면 정렬을 거부하고 비교하지 않는다
  min_inlier_ratio: 0.3
  max_rms_m: 0.02

# 사진별 물체 탐지와 다시점 삼각측량.
objects:
  # owlv2(실제, CPU ONNX) | unavailable. stub(oracle)은 테스트·--oracle로만.
  detector: owlv2
  model: owlv2_onnx
  tokenizer: owlv2_tokenizer
  score_threshold: 0.2
  nms_iou: 0.3
  # 온톨로지 objects 키 → 영어 질의. 고정 구조(벽·바닥)는 넣지 않는다 (움직이는 물체만)
  queries:
    bucket: a bucket
    trash_bin: a trash bin
    pillow: a pillow
    towel: a towel
    cup: a cup
    spray_bottle: a spray bottle
    mop: a mop
  appearance_bins: [8, 4]        # 색상(H) x 채도(S) 히스토그램 칸 수
  appearance_crop: 0.6           # 상자 가운데 이 비율만 색을 잰다 (배경 섞임 줄이기)
  center_tolerance: 0.25         # 다른 사진에 다시 투영한 중심이 상자 대각선의 이 비율 안이면 같은 물체
  min_views: 3                   # 이보다 적은 사진에서만 보인 물체는 내지 않는다
  full_views: 6                  # 이만큼 보이면 시점 수로 깎는 신뢰도가 없다

# 전후 물체 대응과 변화 분류.
change:
  require_metric: true           # before 복원이 미터 단위가 아니면 비교를 거부한다
  unchanged_tolerance_m: 0.05    # 이동 거리가 이 이하면 unchanged, 넘으면 moved
  max_appearance_distance: 0.5   # 색 히스토그램 거리(Hellinger)가 넘으면 같은 물체가 아니다
  max_size_ratio: 1.6            # 크기 비가 넘으면 같은 물체가 아니다
  distance_scale_m: 3.0          # 거리 비용을 이 거리에서 1로 자른다
  weights:
    appearance: 1.0
    size: 0.5
    distance: 0.2

# 장면 안 바디캠 위치 추정 (dlp scene3d localize, ADR 0067). 입력은 그 세션의 지금 승인된 블러본 바디캠 영상과
# 전후 복원·받아들인 정렬이다. 프레임 특징(2D 위치 + 기술자)을 복원의 희소 점 기술자와 대응시키고 PnP RANSAC으로
# 카메라 자세를 before 장면 좌표로 구한다. 프레임마다 before·after 복원 둘 다에 풀어 내점이 많은 쪽을 쓴다.
# 바디캠 내부 파라미터는 등록된 캘리브레이션(dlp calib)만 쓴다 (없으면 거부, 화각을 지어내지 않는다).
# 아래 값은 합성 방으로만 맞춘 것이다 (실영상 실측 전).
localization:
  # 프레임 특징 추출: pycolmap(실제, 격리 환경 SIFT) | unavailable. 정답을 아는 stub(oracle)은 정책이 아니라
  # 테스트·--oracle로만 끼운다.
  # TODO(real-model): scripts/gsplat-env/extract_frame_features.py는 CPU판 pycolmap으로 합성 그림에서만
  # 돌려 봤다. GPU 서버의 잠금 환경과 실제 바디캠 영상에서는 실측 전이다.
  features: pycolmap
  features_tool: colmap          # config/models.yaml external 이름 (라이선스 검사 대상)
  max_features: 4096             # 프레임 한 장에서 뽑는 특징 수 상한
  frame_interval_ms: 200         # 앞서 고른 프레임보다 이만큼(PTS ms) 뒤인 프레임만 푼다
  descriptor_ratio: 0.8          # 프레임 특징 ↔ 복원 점 기술자 최근접 비율 검사 (낮을수록 엄격)
  # 재투영 오차 문턱은 화소가 아니라 프레임 가로(화소)에 대한 비율이다 (해상도가 달라도 같은 각도 오차).
  # 0.003이면 가로 640에서 1.9 화소, 1920에서 5.8 화소.
  ransac_reproj_ratio: 0.003     # PnP RANSAC 내점 판정: 재투영 오차가 프레임 가로의 이 비율 이내
  # 반복 상한. 대응의 80%가 틀려도(내점 20%) 99.9%로 찾는 횟수가 약 4,300이다. 내점이 많으면 일찍 끝난다
  ransac_iterations: 5000
  ransac_confidence: 0.999
  min_inliers: 20                # 아래 셋 중 하나라도 못 미치면 그 프레임의 자세를 기록하지 않는다 (지어내지 않는다)
  max_reproj_ratio: 0.002        # 다듬은 뒤 내점 재투영 오차 RMS 상한 (프레임 가로의 비율)
  min_inlier_spread: 0.25        # 내점을 둘러싼 상자의 대각선이 화면 대각선의 이 비율보다 작으면 버린다 (한곳에 몰린 내점)
  # 캘리브레이션 해상도와 프레임의 화면비 상대 차이가 이보다 크면 거부한다 (prelabel.yaml과 같은 뜻.
  # 같은 화면비의 축소·확대는 비례 조정한다)
  max_intrinsics_aspect_mismatch: 0.02

# 위치 기록을 읽을 때 (dlp_scene3d.localize.pose_at). 임의 시각의 자세는 이웃한 두 프레임 사이에서 보간한다
# (카메라 중심은 선형, 회전은 구면). 계산에 쓰지 않으므로 어떤 단계의 모델 버전에도 들어가지 않는다.
interpolation:
  max_gap_ms: 500                # 이웃한 두 자세의 간격이 이보다 크면 보간하지 않는다 (없음)
