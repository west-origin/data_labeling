# 프라이버시 게이트 정책 (WP5). 유지 시간·렌더 방식·오디오 제거는 config/defaults.yaml privacy를 따른다.
version: 1

# 대상별 박스 여유(박스 크기 대비 비율)와 쓰는 탐지기. 탐지기는 아래 detectors에 정의한다.
targets:
  face: {margin: 0.2, detectors: [yunet]}
  reflection: {margin: 0.2, detectors: [reflection]}
  shipping_label: {margin: 0.05, detectors: [codes, open_vocab]}
  document: {margin: 0.05, detectors: [open_vocab]}
  screen: {margin: 0.05, detectors: [open_vocab]}
  photo: {margin: 0.05, detectors: [open_vocab]}
  address_sign: {margin: 0.05, detectors: [open_vocab]}

# 재현율 우선: 낮은 문턱으로 잡고 사람이 오탐을 지운다
detection_threshold: 0.3
review_score: 0.6             # 트랙 점수가 이보다 낮은 구간은 검수 우선 구간

tracker:
  iou_match: 0.2              # 같은 트랙으로 이을 최소 IoU
  max_gap_ms: 600             # 이보다 짧은 끊김은 선형 보간으로 메운다

render:
  min_block_px: 6             # 모자이크 블록 최소 크기
  blocks_per_box: 5           # 박스 짧은 변을 이 개수 이하의 블록으로 나눈다

# 검수 우선 구간 종류와 우선순위 (앞이 먼저)
review_priority: [no_detector, track_gap, disagreement, low_confidence, reflection]

detectors:
  yunet:
    kind: yunet
    model: yunet              # config/models.yaml 이름
  codes:
    kind: opencv_codes        # QR·바코드 (가중치 없음) → 송장 근거
  reflection:
    kind: reflection          # 반사면 영역 안에서 얼굴 탐지 문턱을 낮춘다
    region_detector: open_vocab
    face_detector: yunet
    threshold_scale: 0.5
  # 오픈 보캐뷸러리 탐지 (OWLv2 base, ONNX 양자화, CPU 프레임당 약 9초).
  # 한 번 추론으로 문서·화면·사진물·문패·송장과 반사면 영역(reflection 탐지기용)을 함께 찾는다.
  # frame_stride_ms마다 한 번 추론하고 그 사이 프레임에는 마지막 결과를 그대로 둔다 (held).
  # 사이에 잠깐 나타났다 사라진 대상은 놓칠 수 있으므로 GPU 환경에서는 간격을 줄인다.
  open_vocab:
    kind: open_vocab
    model: owlv2_onnx
    tokenizer: owlv2_tokenizer
    frame_stride_ms: 500
    score_threshold: 0.1      # OWLv2 원점수 문턱 (재현율 우선으로 낮게)
    score_full: 0.4           # 이 원점수 이상을 신뢰도 1.0으로 본다 (원점수 / score_full)
    # 질의 문장 → 대상 ID. reflective_surface는 reflection 탐지기만 쓴다.
    queries:
      a printed document: document
      a sheet of paper with text: document
      a computer monitor screen: screen
      a smartphone screen: screen
      a television screen: screen
      a framed photograph: photo
      a photo of a person: photo
      a door number sign: address_sign
      a nameplate: address_sign
      a shipping label on a parcel: shipping_label
      a mirror: reflective_surface
      a glass window: reflective_surface
