# 검수 운영 정책 (WP12). 배정 비율(QA·이중·블라인드·오류 삽입)은 config/defaults.yaml review를 따른다.
#
# 읽는 곳: dlp_review.ops.policy.load_policy (Pydantic ReviewOpsPolicy로 검증, 알 수 없는 키는 오류).
# 쓰는 명령: dlp review create|collect|serve|plan|assign|qa|quality, dlp review revoke --orphans(orphans 절),
# dlp ops weekly(운영 지표)·audit-report. ai_review 절은 AI 1차 검수 판정을 쓰는 방식(WP17.6)이다.
# 이 파일은 파싱한 값으로만 쓰고 텍스트 해시를 만들지 않으므로 주석을 고쳐도 동작이 바뀌지 않는다.
# 키를 더하거나 이름을 바꾸면 dlp_review/ops/policy.py 모델도 함께 바꿔야 한다.

# 정책 파일 형식 버전 (정수). 형식이 바뀔 때만 올린다.
version: 2

# 웹훅 HTTP 경계. 운영에서는 TLS·요청 속도 제한을 제공하는 게이트웨이 뒤에서 실행한다.
webhook:
  bind_host: "0.0.0.0"                # 도구 컨테이너의 연결을 허용; 방화벽으로 도구/게이트웨이만 허용
  max_body_bytes: 1048576              # 본문 최대 1 MiB (초과 요청은 413)
  request_timeout_s: 10                # 헤더의 유휴 제한 및 본문 전체 읽기 제한 (초)
  max_workers: 16                      # 연결 처리 스레드 상한 (초과 요청은 503)
  retry_after_s: 30                    # 일시 실패·과부하의 Retry-After (초)

# DB 기록 없이 남은 도구 작업·라벨링 버킷 사본(고아) 정리 (dlp review revoke --orphans, F-REV-15).
# 작업 생성은 CVAT·Label Studio 작업과 워터마크 사본을 먼저 만들고 DB에 나중에 커밋한다. 막 만든 것을
# 고아로 지우지 않게 생성 시각에서 이만큼 지난 것만 본다 (세션 잠금으로 진행 중 생성도 건너뛴다).
orphans:
  # 0 이상 정수(초). 줄이면 고아가 빨리 지워지지만, 오래 걸리는 작업 생성(큰 영상 업로드)보다 짧으면
  # 세션 잠금만으로 경합을 막는다. 늘리면 롤백으로 남은 노출이 그만큼 오래 남는다.
  min_age_s: 3600

# 검수 화면용 매체 (dlp_review.watermark, dlp_review.timeseries)
media:
  # 범위 (0, 1]. 높이면 유출 추적은 쉬워지지만 검수자가 화면을 보기 어려워진다.
  watermark_opacity: 0.18             # 라벨러 ID 워터마크 불투명도 (화면 캡처 유출 추적)
  # libx264 CRF, 범위 0~51 (낮을수록 고화질·큰 파일). 검수에 쓰는 화질이라 너무 높이지 않는다.
  watermark_crf: 20                   # 워터마크 영상 화질
  # 정수 > 0. 출력 프레임 PTS는 원본을 그대로 쓰므로 재생 시각·키프레임 매칭에는 영향이 없다.
  encoder_rate: 30                    # libx264 명목 프레임레이트 (프레임 PTS는 원본 그대로)
  # Hz > 0. 격자 간격 = 1000 / 값 (ms). 1000의 약수가 아니면 time_ms 열에 소수가 생긴다.
  # 높이면 CSV가 커지고 Label Studio 화면이 느려진다.
  timeseries_rate_hz: 50              # 장갑·IMU 시계열 CSV 격자 (마스터 타임라인)
  # 초, 범위 (0, 604800] (S3 SigV4 서명 상한 7일). Label Studio 작업에 박는 영상·시계열 서명 URL의
  # 유효 시간이다 (라벨러 자격 증명으로 서명). 줄이면 새어 나간 URL이 빨리 끊기지만 열린 작업을 그만큼
  # 자주 다시 서명해야 한다: `dlp review refresh-urls`를 이 값보다 짧은 주기로 돌린다 (F-REV-08).
  signed_url_ttl_s: 604800            # 7일

# 검수 단위: 세션 × 스트림 × 라벨 종류 묶음. 묶음마다 검수 도구가 다르다.
# 도구가 보여 주는 종류만 쓴다 (보여 주지 않는 종류를 표본으로 뽑으면 판정이 끝나지 않는다).
# 관계·설명은 아직 검수 도구 화면이 없어 단위에 넣지 않는다.
# 허용 값: spatial ⊆ (box_track, keypoint_track), temporal ⊆ dlp_review.labelstudio.LS_KINDS.
# 벗어나면 정책 로드가 실패한다 (UnitsPolicy 검증).
units:
  spatial: [box_track, keypoint_track]                            # CVAT, 스트림별
  temporal: [action, gap, segment, event, hand_state, object_state]  # Label Studio, 세션 단위

# 우선순위 큐: 단위 안에서 사유가 붙은 구간을 찾고, 단위 우선순위 = Σ 사유 가중치 × 구간 길이(초).
# 모델 출처 라벨만 본다 (dlp_review.ops.priority.flag_unit). 임계값은 모두 0~1.
priority:
  low_confidence: 0.5                 # 이보다 신뢰도가 낮은 모델 라벨
  # 같은 키프레임 시각의 박스 IoU (보간하지 않는다). 낮추면 불일치 사유가 늘어난다.
  disagreement_iou: 0.5               # 다른 모델(버전)의 박스가 이만큼 겹치는데 클래스가 다르면 불일치
  # 겹침 비율의 분모는 두 구간 중 짧은 쪽 길이다.
  disagreement_overlap: 0.5           # 다른 모델의 시간 구간이 이 비율 이상 겹치는데 분류가 다르면 불일치
  contact_mismatch_max_confidence: 0.7  # 장갑 세션에서 이 이하 신뢰도의 접촉 라벨 = 장갑·영상 한쪽만 접촉
  # 사유 이름(dlp_schema.review.ReviewReason 값) → 가중치. 없는 사유(sample, routine)는 0으로 본다.
  # 상대 크기만 의미가 있다: 큰 사유가 붙은 단위가 큐 앞으로 온다.
  weights:
    contact_mismatch: 4.0
    model_disagreement: 3.0
    new_object: 2.0
    low_confidence: 1.0
    # AI 1차 검수 판정 (WP17.6, ADR 0040). 사람 검수를 늘리는 쪽으로만 쓴다 (먼저 볼 단위).
    # 증가 프로필(렌더 해시와 무관)의 유효한 판정이 붙은 라벨 구간 (길이는 ai_review.span_cap_ms로 자름)
    ai_wrong: 5.0
    ai_suspect: 2.5
    ai_missing: 2.0                   # 누락 후보 (v1 기본 끔, 표시·우선순위는 후속 F-AIR-08)
    ai_unsure: 0.5
  # 0 이상. 사유가 있는 단위보다 뒤로 가도록 작은 값을 둔다.
  routine_priority: 0.1               # 사유가 없는 단위의 기본 우선순위

# 높은 신뢰도 라벨은 묶음(세션·종류·모델 버전)마다 표본만 검수한다. 표본에서 고친 비율이
# max_defect_ratio 이하이면 묶음의 나머지 미검수 라벨을 "표본 검증"으로, 넘으면 묶음 전체를 검수 큐에 넣는다.
# 표본 수 = min(N, max(min_sample, ⌈ratio·N⌉)). 블러(privacy) 단위에는 적용하지 않는다 (전수 검수).
sampling:
  # 0~1. 이 신뢰도 이상인 미검수 모델 라벨만 표본 묶음에 든다. 낮추면 사람이 보지 않는 라벨이 늘어난다.
  high_confidence: 0.85
  # (0, 1]. 묶음 대비 표본 비율.
  ratio: 0.1
  # 1 이상. 묶음당 최소 표본 수 (작은 묶음은 사실상 전수).
  min_sample: 5
  # 0~1. 표본 결함(사람이 고치거나 지운) 비율 허용치. 높이면 오류가 많은 묶음도 합격한다.
  max_defect_ratio: 0.05

# 검수 품질 측정 (이중 라벨 일치도, 프리라벨 편향)
measurement:
  # 0 이상 (ms).
  tolerance_ms: 200                   # 경계 일치 허용 오차
  # (0, 1].
  match_iou: 0.5                      # 두 라벨 묶음의 구간을 맞추는 시간 IoU

# 오류 삽입 과제: 정답을 아는 단위(모든 라벨이 사람이 만들거나 승인·수정한 것)의 사본에 오류를 넣는다.
seeding:
  # 1 이상. 후보가 모자라면 덜 넣는다.
  errors_per_task: 3
  # 하나 이상. 순서대로 돌아가며 넣는다 (단위에 후보가 없는 종류는 건너뛴다).
  types: [boundary_shift, class_swap, blur_deletion]
  # [최소, 최대] ms, 양끝 포함. 최소값은 detect_tolerance_ms보다 커야 "되돌림"을 구별할 수 있다.
  boundary_shift_ms: [300, 800]       # 경계 허용 오차(200 ms) 밖으로 옮긴다
  # 0 이상 (ms).
  detect_tolerance_ms: 200            # 검수자가 이 안으로 되돌리면 발견한 것으로 본다
  # (0, 1]. 분모는 뺀 블러 구간 길이.
  blur_overlap: 0.5                   # 다시 그린 블러가 뺀 블러와 시간이 이만큼 겹치면 발견

# 검수자 역할. QA는 선임만, 블라인드·이중 배정은 표준 배정과 다른 사람에게 준다.
# 블러 검수(원본 영상)는 privacy 목록에 있는 원본 접근 권한자에게만 배정한다. 블러 단위는 QA·일반
# 오류 삽입 과제에 쓰지 않는다 (블러 오류 삽입은 --privacy 계획에서 권한자에게만).
# privacy 목록은 원본 접근 감사(dlp ops audit-report)의 권한자 명단에도 쓰인다. 사람을 더할 때는
# 원본 접근 권한 승인 절차를 먼저 밟는다.
reviewers:
  senior: []                          # 비어 있으면 QA 배정의 담당자를 비워 둔다 (작업은 dlp review assign <배정> --assignee <선임>으로 만든다)
  privacy: []                         # 원본 접근 권한자

# CVAT 계정 연결 (ADR 0024). 작업을 만들면 담당자의 CVAT 계정에 작업(job)을 배정하고, 웹훅은 job 담당자가
# 이 연결과 맞을 때만 수집한다. 블러 검수 담당자는 여기 없으면 작업을 만들지 않는다 (원본을 올리기 전에 멈춘다).
# 검수자 CVAT 계정은 관리자가 아닌 일반 사용자(user/worker 그룹)로 만든다.
# 배정만으로 열람 범위를 보장하지 않는다. 프로젝트·조직 권한까지 실제 계정으로 점검한다.
cvat:
  # dlp 검수자 ID → CVAT 사용자 이름. 한 CVAT 계정을 두 검수자에게 줄 수 없다 (로드 시 검증).
  users: {}                           # 예: {rev01: cvat-rev01}
  # 0 이상. 0이면 이슈를 남기지 않는다.
  privacy_issue_limit: 50             # 블러 검수 작업에 이슈로 남기는 검수 우선 구간 최대 수 (우선순위 순)

# Label Studio 계정 연결 (F-REV-06). 수집(dlp review collect)과 웹훅(dlp review serve)은 작업 담당자의
# Label Studio 계정이 만들고(completed_by) 마지막으로 고친(updated_by) 주석만 받는다. 다른 사용자·서비스
# 계정의 주석은 결과로 쓰지 않고 오류·서버 로그로만 남긴다. 검수 시간(lead_time)도 같은 주석만 더한다.
# 담당자가 여기 없으면 Label Studio 시간 검수 작업을 만들지 않는다 (매체를 올리기 전에 멈춘다).
# Label Studio Community는 작업을 사람에게 배정하는 API가 없어(Enterprise 기능) 조직의 다른 사용자도
# 작업을 열 수 있다. 이 연결은 그 제출을 담당자의 검수로 기록하지 않게 할 뿐 열람을 막지는 않는다.
# 검수자 계정은 서비스 계정(DLP_LABEL_STUDIO_TOKEN의 계정)과 다른 사람별 계정으로 만든다.
label_studio:
  # dlp 검수자 ID → Label Studio 사용자 이메일. 한 계정을 두 검수자에게 줄 수 없다 (로드 시 검증).
  users: {}                           # 예: {labeler01: labeler01@example.com}

# AI 1차 검수 판정을 검수 운영에 쓰는 방식 (WP17.6, ADR 0040, dlp_review.ai_display). 판정은 참고용이고
# 라벨도 검수 상태도 아니다. 사람 검수를 늘리는 쪽(우선순위 priority.weights ai_*, 표본 제외, 늦은 지적의
# 재검수 배정 `<배정>:ai-flagged`)으로만 쓰고, AI의 ok는 아무것도 줄이지 않는다.
# 절을 빼면 off(코드 기본값). 저장소 값은 장비 도착 전 advisory다.
ai_review:
  # off: AI 표를 읽지 않는다 (Label Studio 설정의 AI 컨트롤은 그대로 두고 채우지 않는다. 컨트롤을 빼면
  #      AI 영역이 든 주석이 있는 프로젝트에서 설정 갱신이 거부된다).
  # advisory: 작업을 만들 때 유효한 판정만 얹는다 (판정이 없으면 작업 데이터·프리라벨 예측이 지금과 같고
  #      요약 "AI 1차 검수: 없음"만 더한다).
  # required: advisory + `dlp review plan`이 지금 버전의 완료된 판정 실행(dlp aireview run)이 없는 세션의
  #      배정을 미룬다 (종료 코드 6). `dlp aireview waive <세션> --reason`이 있거나 prelabeled 뒤
  #      max_wait_h가 지나면(waived:timeout을 남김) 진행한다 — 서버가 없거나 고장이어도 검수가 영구히
  #      멈추지 않는다.
  # required로 바꾸는 절차 (파일럿 WP17.9 뒤): 파일럿 지표(지적 정밀도, holdout 기준 층별 ok 놓침률 상한,
  #      검수 시간 비교)를 ADR 0040 후속·인수인계 상태표에 기록한 뒤 mode: required, max_wait_h: 24.
  mode: advisory
  # 시간 (> 0). required에서만 쓴다.
  max_wait_h: 24
  # 표시·증가에 쓸 판정 버전 목록 (aireview-<digest>+vlm-<model>). 비면 aireview.yaml 지금 버전만.
  # 정책·모델을 바꾼 뒤 재판정이 끝날 때까지 이전 버전도 보이려면 둘 다 적는다.
  versions: []
  # 판정을 보일 배정 방식 (standard, double만 허용). 블라인드·오류 삽입·QA 작업에는 보이지 않는다.
  # double(이중)은 짝 표준 배정의 대조군 결정을 따른다 (AI 없는 화면이 측정 작업 신호가 되지 않게).
  show_modes: [standard, double]
  # 0~1. 루트 배정(재검수 접미사를 뗀 배정, 직접 작업은 작업 키)마다 sha256(키|seed)로 정하는 대조군
  # 비율. 대조군 작업에는 판정을 보이지 않고 노출 기록에만 남긴다 (편향 없는 품질 추정, 결정 0.1).
  holdout_ratio: 0.1
  holdout_seed: 0
  # 0~1. 판정 값별 최소 확신도 (모델 자기 보고 값, 보정 전에는 0으로 둔다). ok는 구간 표시하지 않는다.
  show_min_confidence: {wrong: 0.0, suspect: 0.0, unsure: 0.0}
  # 0 이상. 라벨 시각 기준 10분마다 따로 표시하는 판정 수 상한 (틀림 → 의심 → 판단 불가 순).
  max_flags_per_10min: 30
  # ms > 0. 이보다 긴 라벨은 우선순위 구간을 이 길이로 자르고, 화면에는 근거 시각 주변
  # evidence_window_ms(±절반)만 AI 구간으로 표시한다.
  span_cap_ms: 10000
  evidence_window_ms: 2000
  # 0 이상. CVAT 공간 작업 하나에 다는 AI 이슈 상한 (나머지는 노출 기록 hidden).
  cvat_issue_limit: 200
  # 표본 검수 묶음에서 빼고 반드시 검수하는 판정 (wrong·suspect·unsure 중). 표본 합격 뒤 늦게 도착한
  # 같은 판정의 보류 라벨은 sample_verified로 두지 않고 `<배정>:ai-flagged` 재검수 배정으로 보낸다.
  sampling_exclude: [wrong, suspect, unsure]
  # true면 맥락 라벨까지 지금도 현재여야 판정을 유효로 본다. false(결정): 사람 검수가 진행될 때마다
  # 판정이 무효가 되어 재판정만 늘지 않게 한다 (표시는 참고용, 증가는 안전한 쪽).
  strict_context: false
