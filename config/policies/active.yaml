# 액티브 러닝 정책 (WP14). 다음에 검수·라벨링할 세션을 고른다.
# 세션 안의 검수 순서는 config/policies/review.yaml priority(우선순위 큐)이고, 이 점수와 별개다.
version: 1

# 클래스별 검수자 수정률 = (고침 + 지움 [+ 놓쳐서 추가]) / (개별 검수한 모델 라벨 + 추가).
# 표본 검증 상태는 개별 검수가 아니므로 세지 않는다. 검수 수가 적은 클래스는 전체 수정률 쪽으로 당긴다:
#   (고친 수 + prior_weight × 전체 수정률) / (검수 수 + prior_weight)
correction:
  count_added: true
  prior_weight: 20

# 후보 세션: 프리라벨이 끝나고 아직 사람 검수를 마치지 않은 세션. 골든셋 세션은 사람이 처음부터
# 라벨링하므로 후보에서 뺀다.
candidates:
  lifecycle: [prelabeled]
  exclude_golden: true

# 블러는 종료 조건 전까지 전수 검수라 점수에 넣지 않는다.
excluded_kinds: [blur_track]

# 세션 점수 = Σ 가중치 × 항목 점수. 기준 문서대로 처음에는 수정률 하나만 쓰고, 운영이 안정되면
# 항목을 하나씩 추가한다 (dlp_active.terms에 등록된 이름: correction_rate, uncertainty).
score:
  normalize: total          # total(세션 전체) | per_minute(영상 1분당)
  terms:
    correction_rate: 1.0

select: 10                  # 한 번에 고르는 세션 수 (dlp active rank --limit)

fiftyone:
  dataset_prefix: dlp-active-
  frame_tolerance_ms: 1     # 라벨 키프레임 시각과 블러본 프레임 시각의 허용 차이 (ms 반올림만)
