# 재학습 루프 정책 (WP13).
# 검수 승인 → 데이터셋 버전 → 누적 확인 → 학습 → 골든셋 평가 → 게이트(config/policies/evaluation.yaml) → 배포.
# 로더: dlp_train.policy.load_policy → TrainingPolicy (모르는 키는 거부, 아래 규칙은 검증기가 막는다).
# 사용처: dlp train run|approve(dlp_cli.train_cmds), 배포 모델 붙이기(dlp_train.deployed). 관련 ADR 0016·0025.
# 이 파일은 모델 버전 해시에 들어가지 않는다 (모델 버전 태그는 과제·데이터셋 버전·학습기·파라미터·시각).

# 정책 형식 버전 (정수).
version: 1

# 학습에 쓰는 분할. 골든·holdout은 절대 쓰지 않는다 (검증기가 막는다).
splits: [train, val]

# 학습 예제가 되는 라벨: 사람이 만든 라벨과 아래 검증 상태의 라벨 (미검수 모델 라벨은 쓰지 않는다).
# unreviewed를 넣으면 검증기가 거부한다. sample_verified를 빼면 표본 검증으로 인정된 모델 라벨이 빠진다.
trainable_states: [human_approved, human_corrected, sample_verified]

# 학습 산출물(가중치·평가 리포트)은 config/defaults.yaml buckets.mlflow 버킷의 이 접두 아래에 둔다.
# 키: <artifact_prefix>/<과제>/<모델 버전>/<파일>. 바꾸면 이미 등록된 모델의 artifact_uri는 그대로다.
artifact_prefix: models

# MLflow 이름 규칙. 바꾸면 기존 실험·등록 모델과 이어지지 않는다 (새 이름으로 시작).
mlflow:
  experiment_prefix: dlp-train-       # 실험 이름 = 접두 + 과제
  registered_model_prefix: dlp-       # MLflow 모델 레지스트리 이름 = 접두 + 과제 (DB 레지스트리의 사본)
  deployed_alias: deployed            # 배포 버전에 붙이는 MLflow 별칭

# 과제별 학습 작업 템플릿.
#   stage: 배포 모델 연결 단계 (prelabel: 프리라벨 Predictor, privacy: 블러 탐지기).
#     actions는 예약 값이며 현재 행동 실행 경로에는 연결되지 않았다.
#   replaces: 배포되면 대신하는 기본 어댑터 이름 (Predictor.name). 프라이버시는 탐지기 합집합이라 빼지 않는다
#   min_examples: 학습을 시작할 최소 예제 수, min_new_examples: 직전 학습 대비 새로 늘어야 할 예제 수
#     (직전 = 상태와 상관없이 그 과제의 가장 최근 모델 버전. --force로 무시한다)
#   deploy: auto(게이트 통과 시 바로 배포) | approve(게이트 통과 후 사람이 `dlp train approve`)
#     privacy는 approve여야 한다 (검증기가 막는다)
#   trainer·params: 기본 학습기와 하이퍼파라미터 (`dlp train run --trainer --param`으로 바꾼다)
#     oracle-stub params: jitter_px(정답 좌표 흔들림 표준편차, px), seed, confidence(기본 0.9)
#     yolox(objects 과제만, ADR 0062) params: 아래 yolox 절의 값을 덮는다 (base_model, epochs, batch_size,
#       lr_per_img, warmup_iters, fp16, seed, allow_cpu, max_iters). 예: dlp train run objects <버전> --trainer yolox
#   replaces가 있는 과제는 첫 배포 전 비교할 기본 어댑터 예측 버전(--baseline-version)이 필요하다.
# 실제 학습기: objects의 yolox(고정 클래스 물건 탐지, prelabel.yaml closed_vocab_tools 클래스)만 있다. 기본
#   학습기는 CI가 도는 oracle-stub 그대로다 (yolox는 GPU 학습 서버와 격리 환경이 필요하다).
# TODO(real-model): 손·전신 RTMPose 미세조정, 접촉 영상 분류기(장갑 세션 정답), 블러 탐지기 미세조정은 아직
#   학습기가 없다 (oracle-stub만). GPU 학습 서버가 필요하다.
# objects: 배포되면 COCO 객체(objects)·OWLv2 도구(tools)·공개 데이터 고정 클래스 도구(closed_tools) 박스를 대신한다.
#   첫 배포 비교는 그 셋의 골든 예측 버전을 모두 --baseline-version으로 준다 (closed_tools는 켠 경우만).
tasks:
  objects:  {stage: prelabel, replaces: [objects, tools, closed_tools], min_examples: 200, min_new_examples: 50, deploy: auto,
             trainer: oracle-stub, params: {jitter_px: 0.0}}
  hands:    {stage: prelabel, replaces: [hands], min_examples: 200, min_new_examples: 50, deploy: auto,
             trainer: oracle-stub, params: {jitter_px: 0.0}}
  body:     {stage: prelabel, replaces: [body], min_examples: 200, min_new_examples: 50, deploy: auto,
             trainer: oracle-stub, params: {jitter_px: 0.0}}
  # contact: 배포되면 프리라벨의 휴리스틱 접촉(라벨 ID `<세션>-contact-`, 버전 contact-heuristic-1+p…+i…)을
  #   대신한다. replaces의 "contact"는 그 휴리스틱 단계를 뜻한다: dlp_prelabel.runner는 replaced에 contact가
  #   있으면 휴리스틱 접촉(_contacts)을 돌리지 않고 검수 전 `<세션>-contact-` 라벨을 지운다.
  #   기본(휴리스틱) 접촉과 비교할 때는 버전이 세션마다 다르므로 --baseline-version contact-heuristic-1*.
  #   접촉은 타임라인 구간(stream 없음)이라 프리라벨은 배포 모델 trained-contact를 prelabel.yaml
  #   timeline_predictors에 따라 기준 스트림에서 세션당 한 번만 돌린다 (골든 평가도 기준 스트림에 한 번).
  #   deploy: approve는 프리라벨이 스트림마다 돌려 구간이 겹치던 때 정한 값이다 (그 문제는 해소됨).
  contact:  {stage: prelabel, replaces: [contact], min_examples: 200, min_new_examples: 50, deploy: approve,
             trainer: oracle-stub, params: {jitter_px: 0.0}}
  # TODO(real-model): 행동 단계(dlp actions run)는 아직 배포된 행동 모델(deployed_predictors stage actions)을
  #   읽지 않는다. 배포해도 쓰이지 않으므로 연동 전까지 사람 승인으로 둔다 (승인해도 효과가 없다).
  actions:  {stage: actions, replaces: [], min_examples: 200, min_new_examples: 50, deploy: approve,
             trainer: oracle-stub, params: {jitter_px: 0.0}}
  # privacy: 배포되면 블러 탐지기 목록에 더한다 (기본 탐지기는 빼지 않는다). 블러는 사람 승인 후에만 배포.
  privacy:  {stage: privacy, replaces: [], min_examples: 200, min_new_examples: 50, deploy: approve,
             trainer: oracle-stub, params: {jitter_px: 0.0}}

# 학습 증강 (ADR 0057, dlp_train.augment). 픽셀과 라벨(박스·마스크·2D 키포인트·3D 궤적·손 좌우)을 같은 변환으로
# 함께 바꾼다. 입력은 학습·검증 분할의 블러본만 (골든·holdout·원본 버킷은 거부). 증강본은 학습 메모리 안에만 있고
# 라벨 이력·판매 내보내기에 들어가지 않는다. 설정 해시가 학습 파라미터 augmentation으로 모델 버전·MLflow에 남는다.
# 픽셀을 쓰는 학습기는 yolox(objects)뿐이다: 학습 분할 블러본 이미지마다 copies개 증강본을 COCO 학습 데이터에 더한다
# (ADR 0062). oracle-stub은 설정 해시·사본 수만 산출물에 적는다.
augmentation:
  enabled: true
  tasks: [objects, hands, body, privacy]
  seed: 0
  copies: 2                 # 표본마다 증강본 수
  geometric:
    hflip_p: 0.5            # 좌우 뒤집기 (손 판정 left↔right, COCO 좌우 관절 교환, 3D x 반전)
    rotate_deg: 10          # ±10도 (장착 기울기)
    scale_range: [1.0, 1.25]  # 확대(자르기) 배율
    perspective_frac: 0.03  # 모서리 ±3% 흔들기
  photometric:
    brightness: 0.15
    contrast: 0.2
    blur_sigma_max: 1.5
    noise_std_max: 6.0
    jpeg_p: 0.5
    jpeg_quality_range: [40, 90]
  egocentric:
    motion_blur_px_max: 9   # 빠른 손 흐림 (30 fps 실영상)
    highlight_p: 0.3        # 젖은 손·스테인리스 반사광
    highlights_max: 3
    highlight_rx_range: [0.01, 0.06]   # 반사광 타원 가로 반지름 (화면 너비 비율): 작고 납작한 점 반사
    highlight_ry_range: [0.005, 0.03]  # 세로 반지름 (화면 높이 비율)
    highlight_soft: 0.01               # 가장자리 흐림 폭 (화면 너비 비율, 최소 1 px)
    distortion_k1_max: 0.08 # 초광각·렌즈 차이

# YOLOX 실제 학습기 (trainer: yolox, ADR 0062, dlp_train.yolox). 고정 클래스 물건 탐지기를 우리 검수 박스로 미세조정한다.
# - 클래스 순서·입력 크기는 prelabel.yaml closed_vocab_tools(classes, input_size)를 그대로 쓴다 (로더가 그 어댑터의
#   탐지기 자리에 끼운다). 그 목록 밖 클래스의 박스는 학습 주석에서 뺀다.
# - 학습 예제: 데이터셋 버전의 학습·검증 분할, 운영 라벨, 사람이 만들었거나 승인·수정·표본 검증한 box_track
#   (dlp_train.extract). 이미지 = 지금 승인된 블러본에서 그 키프레임 시각(PTS 인덱스)의 프레임만. 학습 분할 이미지는
#   위 augmentation 절로 증강본(copies개)을 더한다 (objects가 augmentation.tasks에 있을 때).
# - 실제 학습은 격리 환경(env.project, uv.lock 고정)에서 subprocess로 돈다. 본 가상 환경에는 PyTorch가 없다.
# - 산출물: yolox-model.zip (model.onnx: decode_in_inference false + manifest.json).
# 바꾸면 그다음 학습 실행부터 적용된다 (이 절은 모델 버전 태그에 들어가지 않지만 산출물 manifest에 남는다).
yolox:
  env:
    project: scripts/yolox-train-env
    python: "3.12"
    cpu_extra: cpu          # PyTorch CPU판 (GPU가 없을 때)
    cuda_extra: cu128       # nvidia-smi로 GPU가 보이면 이 판을 쓴다
    script: scripts/yolox-train-env/finetune.py
  yolox_commit: 419778480ab6ec0590e5d3831b3afb3b46ab2aa3   # YOLOX 태그 0.3.0 (config/pretrain/objects.yaml과 같다)
  source_dir: data/cache/yolox/YOLOX   # YOLOX clone 위치 (Git 제외, 끝 이름은 YOLOX). 처음 한 번 GitHub에서 받는다
  # 출발 가중치 (config/models.yaml 이름, PyTorch .pth). 공개 데이터 1차 학습 체크포인트를 등록하면(ADR 0060
  # training_datasets·base_model) 그 이름으로 바꾼다. 학습 모델의 상업 사용 분류는 이 가중치의 분류를 물려받는다.
  base_model: yolox_s_coco_pth
  model: yolox_s
  epochs: 30
  batch_size: 16            # GPU 16 GB 기준
  lr_per_img: 0.00015625    # 0.01 / 64 (YOLOX 기본 basic_lr_per_img). 학습률 = 이 값 x batch_size
  warmup_iters: 100
  fp16: true
  workers: 2
  opset: 11
  seed: 0
  jpeg_quality: 95
  min_box_px: 4
  timeout_s: 86400
  # GPU가 없을 때. CPU 학습은 매우 느리다 (yolox_s 640 입력, 반복 하나에 수 초~수십 초).
  # allowed: false면 --param allow_cpu=true 없이는 거절한다. 허용해도 아래 상한으로 자른다 (스모크 크기, 배포 기대 없음)
  cpu:
    allowed: false
    max_epochs: 1
    max_iters: 2
    batch_size: 2
