# 자동 프리라벨 정책 (WP8). 읽는 곳: dlp_prelabel.policy (`dlp prelabel run <세션>`).
# 실제 모델을 아직 연동하지 못한 곳은 "TODO(real-model)"로 표시하고 필요한 것을 적는다.
# 저장소 전체에서 찾기: make todo-models
#
# 정책 해시: 각 어댑터·단계는 자기 절(hands, body, objects, open_vocab_objects, depth, contact,
# wearer_matching)의 "파싱된 값" 해시를 모델 버전에 넣는다 (PrelabelPolicy.digest). 그 절의 값을
# 바꾸면 다음 실행에서 그 단계가 다시 돌고, 검수 전인 이전 결과만 지운다 (검수·사람 결과는 남는다).
# 주석·키 순서·따옴표는 해시에 영향이 없다. models 절과 timeline_predictors는 해시에 들어가지 않는다.
#
# 시간 단위: *_ms 값은 정수 ms. 공간 라벨(손·박스·3D) 쪽 값은 그 스트림 영상 PTS 기준, 접촉 구간은
# 마스터 타임라인 기준이다 (ADR 0019).

# 정책 파일 형식 버전 (코드가 검사하지 않는다. 형식을 바꿀 때 올린다)
version: 1

# 마스터 타임라인 구간(stream_id 없음)을 내는 예측기 이름. 기준 스트림(바디캠)에서 세션당 한 번만 돌린다
# (3인칭 스트림에서도 돌리면 같은 접촉 구간이 두 번 남는다). 배포된 재학습 모델의 이름은
# "trained-<과제>"다 (dlp_train, training.yaml tasks의 타임라인 과제).
timeline_predictors: [trained-contact, trained-actions, trained-relations, trained-states, trained-coverage]

# 역할 → config/models.yaml 이름
# 이름을 바꾸면 그 모델 파일의 해시가 버전에 들어가 해당 어댑터가 다시 돈다. models.yaml의 상업 사용
# 분류(accept)를 통과해야 한다 (make licenses).
models:
  hands: hand_landmarker               # MediaPipe 손 21관절 (adapters/mediapipe_models.MediaPipeHands)
  body_detector: yolox_m_coco          # 사람 박스 (RTMPose 앞단)
  body: rtmpose_m_body7                # 전신 COCO 17점 (adapters/rtmpose.RtmPose)
  coco_objects: object_detector        # COCO 객체 박스 (MediaPipeObjects)
  open_vocab: owlv2_onnx               # OWLv2 도구 탐지 (adapters/owl_objects.OwlObjects)
  open_vocab_tokenizer: owlv2_tokenizer
  depth: depth_metric_indoor_small     # 메트릭 깊이 (lift3d.DepthLifter)

# 손 21관절 (MediaPipe HandLandmarker)
hands:
  min_score: 0.5            # 손 탐지 최소 신뢰도 (0~1). 올리면 누락↑, 내리면 오탐↑
  # MediaPipe 손 판정은 거울상 셀카 화면 기준이다. 1인칭(바디캠·머리캠)은 손등 쪽에서 보므로 손 모양의
  # 좌우가 거울상 셀카와 같아 판정이 그대로 착용자 기준이다 (뒤집지 않는다, F-PAR-61).
  # true는 거울상이 아닌 카메라를 사람이 마주 보는 영상에서만 쓴다. 이 값은 모든 영상 스트림에 적용된다
  # (3인칭 스트림은 사람이 카메라를 보는 방향에 따라 달라 맞지 않을 수 있다, F-PAR-62)
  swap_handedness: false
  # 2D 평활 (One Euro, 정규화 좌표 0~1 단위, ADR 0054). 느릴 때 강하게, 빠를 때 약하게 거른다.
  # min_cutoff_hz를 내리면 정지 떨림이 더 줄고 지연이 는다. beta를 올리면 빠른 동작 지연이 준다.
  # 합성 시험(1920 px 폭, 30 fps, 떨림 4 px)에서 이 값은 정지 오차 x0.8, 느린 동작(약 300 px/s) x0.9,
  # 매우 빠른 동작(약 1300 px/s) x1.2(지연)이다. 떨림이 작은 영상에서는 이득이 작다 (보수적으로 둠)
  smoothing:
    enabled: true
    min_cutoff_hz: 8.0
    beta: 300.0
    d_cutoff_hz: 1.0
    reset_gap_ms: 100       # 이보다 오래 끊긴 뒤에는 필터를 새로 시작한다
  # 짧은 끊김 채우기: 같은 손이 이 이하로 끊긴 사이의 영상 프레임에 앞뒤 관측을 선형 보간한 키프레임을
  # 넣는다 (interpolated, 관절 visibility 1·신뢰도 confidence, world 없음. 3D 단계는 올리지 않는다)
  gap_fill:
    max_gap_ms: 150         # 30 fps에서 약 4프레임. 0이면 채우지 않는다
    confidence: 0.3

# 전신 포즈 (YOLOX 사람 탐지 → RTMPose). 3인칭 착용자 매칭과 바디캠에 보이는 다른 사람 자세에 쓴다
body:
  detector_score: 0.3       # YOLOX 사람 박스 점수 하한
  min_score: 0.3            # RTMPose 관절 점수 평균의 하한
  keypoint_score: 0.3       # 이보다 낮은 관절은 visibility=1 (가려짐 추정)
  max_people: 4             # 프레임당 사람 수 상한
  track_iou: 0.3            # 이전 프레임 박스와 IoU가 이 이상이면 같은 사람 트랙으로 잇는다
  max_gap_ms: 300           # 이 이하로 끊긴 사람 트랙은 하나로 잇는다

# COCO 객체 탐지 (MediaPipe EfficientDet-Lite0)
objects:
  min_score: 0.4            # 탐지 점수 하한 (0~1)
  track_iou: 0.3            # 트랙 잇기 IoU 문턱
  max_gap_ms: 300           # 이보다 오래 끊기면 새 트랙 (새 entity_id)
  # COCO 클래스 → 온톨로지 객체. 매핑이 없는 COCO 클래스는 버린다.
  # 대상은 온톨로지(config/ontology/v1)에 있어야 한다 (test_coco_mapping_targets_exist_in_ontology).
  coco_to_ontology:
    cup: cup
    toilet: toilet
    sink: sink
    bed: bed
    bottle: spray_bottle
    person: person
  # 트랙 거르기 (ADR 0054): start_score 이상 탐지가 나온 뒤부터 트랙을 열고(히스테리시스, 잇기는
  # min_score), 키프레임 min_keyframes개·길이 min_duration_ms 미만 트랙은 버린다
  track_filter:
    start_score: 0.5
    min_keyframes: 3          # 30 fps 3프레임
    min_duration_ms: 60

# COCO에 없는 청소·돌봄 도구는 OWLv2 오픈 보캐뷸러리 탐지로 찾는다 (CPU 프레임당 약 9초).
# frame_stride_ms마다 추론하고, max_gap_ms 안에서 이어지는 탐지를 한 트랙으로 잇는다. 프리라벨은 추론한
# 시각에만 키프레임을 남기고, 사이는 검수 도구와 접촉 단계(contact.video.box_max_gap_ms)가 보간한다.
open_vocab_objects:
  frame_stride_ms: 500      # 추론 간격 (ms). GPU 환경에서는 줄인다. 줄이면 처리 시간이 비례해 는다
  min_score: 0.12           # 모든 질의 공통 점수 문턱 (OWLv2 점수는 낮게 나오는 편이라 작다)
  track_iou: 0.3            # 트랙 잇기 IoU 문턱
  max_gap_ms: 1200          # frame_stride_ms보다 커야 트랙이 이어진다 (지금 2.4배)
  nms_iou: 0.5              # 같은 질의의 박스끼리 IoU가 이 이상이면 점수 낮은 쪽을 버린다
  # 질의 문장 → 온톨로지 객체
  # 질의는 짧은 영어 명사구로 쓴다 (16토큰을 넘으면 잘린다). 대상은 온톨로지에 있어야 한다.
  queries:
    a mop: mop
    a cleaning rag: rag
    a sponge: sponge
    a scrub brush: brush
    a toilet brush: toilet_brush
    a broom: broom
    a dustpan: dustpan
    a spray bottle: spray_bottle
    a bucket: bucket
    a trash bag: trash_bag
    a trash can: trash_bin
    a towel: towel
    a diaper: diaper
    a rubber glove: glove
    a bathtub: bathtub
    a mirror: mirror
  # 트랙 거르기 (ADR 0054). 추론 간격이 500 ms라 키프레임 2개 = 연속 두 번 추론에서 보인 것.
  # 한 번만 보인 실제 도구도 빠진다 (재현 손실). 문턱은 정답 표본으로 다시 정한다 (F-PAR-60)
  track_filter:
    start_score: 0.2
    min_keyframes: 2
    min_duration_ms: 400
  # 장면 → 그 장면에서 물을 질의 (위 queries의 키, ADR 0055). 여기 없는 장면(unknown 등)은 전체 질의다.
  # 장면은 scene 절의 분류기(또는 dlp prelabel run --scene)가 정한다. 장면에 없는 도구는 찾지 않는다(재현 손실)
  scene_queries:
    kitchen: [a cleaning rag, a sponge, a scrub brush, a spray bottle, a bucket, a trash bag, a trash can,
              a towel, a rubber glove, a broom, a dustpan, a mop]
    bathroom: [a mop, a cleaning rag, a sponge, a scrub brush, a toilet brush, a spray bottle, a bucket,
               a towel, a rubber glove, a bathtub, a mirror, a trash can]
    bedroom: [a cleaning rag, a towel, a diaper, a trash bag, a trash can, a spray bottle, a rubber glove,
              a mirror, a broom, a dustpan, a mop]
    living: [a cleaning rag, a broom, a dustpan, a mop, a spray bottle, a trash bag, a trash can, a towel,
             a bucket, a sponge, a mirror]

# 접촉 구간 (모델이 아닌 알고리즘, dlp_prelabel.contact). 결과는 마스터 타임라인 hand_state 라벨이다.
# 대상 종류는 온톨로지 객체 정의로 정한다 (tool 정의 → tool, surface → fixed_surface, 그 밖 → object).
# 사람 박스(물리 유형 person, 위 coco_to_ontology person)와의 접촉은 대상자 부위(body_part, 사람 접촉에
# 필수)를 알 수 없어 라벨을 만들지 않고 `dlp prelabel run` 출력에 개수만 센다. 검수자가 부위와 함께 그린다.
contact:
  # 장갑 압력 합 히스테리시스 (장갑 Parquet의 압력 채널 합, 채널 선택은 sync.yaml glove.pressure_prefixes)
  glove:
    on_threshold: 0.3         # 압력 합이 이 값을 넘으면 접촉 시작
    off_threshold: 0.15       # 이 값 아래로 내려가면 접촉 종료 (히스테리시스)
    min_duration_ms: 60       # 이보다 짧은 접촉은 버린다 (장갑 시각을 쓰는 융합 접촉, 세션 경계에서 잘린 조각도)
  # 영상 휴리스틱: 손가락 끝 다섯 점과 객체·도구 박스 사이 거리
  video:
    max_distance_px: 12       # 손가락 끝과 객체 박스 사이 거리가 이 이하면 접촉 후보
    min_duration_ms: 100      # 이보다 짧은 영상 접촉은 버린다 (세션 경계에서 잘린 조각도)
    merge_gap_ms: 100         # 같은 대상 접촉이 이 이하로 끊기면 잇는다
    # 객체 박스 키프레임이 손 키프레임 시각에 없으면 앞뒤 키프레임을 선형 보간한다 (도구 박스는
    # open_vocab_objects.frame_stride_ms 간격). 앞뒤 키프레임 간격이 이보다 길면 보간하지 않는다.
    box_max_gap_ms: 1200
  # 장갑만 접촉을 잡고 영상에서 대상을 찾지 못한 구간의 target_id (HandStatePayload는 object 접촉에
  # 대상 ID가 필요하다). 관계 규칙(relations.yaml)과 행동 대상 후보(actions.yaml)는 이 ID를 버린다.
  unresolved_target_id: unresolved
  # 출처별 신뢰도. 검수 우선순위는 장갑 세션에서 fused보다 낮은 접촉(장갑·영상 한쪽만)을 먼저 본다
  # (config/policies/review.yaml contact_mismatch_max_confidence는 glove·video보다 크고 fused보다 작게).
  confidence: {fused: 0.9, glove: 0.6, video: 0.5}
  # TODO(real-model): 영상만으로 접촉을 판정하는 학습 분류기 (장갑 세션을 정답으로, `dlp train run contact`).
  #   재학습 루프는 있지만 실제 학습기가 없어 지금은 손가락 끝-객체 거리 휴리스틱만 쓴다.

# 3인칭 영상 속 착용자 찾기 (바디캠 IMU 가속도와 3인칭 인물 손목 속도의 상관, dlp_prelabel.wearer)
wearer_matching:
  rate_hz: 30               # 두 신호를 다시 표본할 격자 (Hz)
  min_correlation: 0.5      # 최고 상관이 이 미만이면 착용자 없음 (-1~1)
  min_overlap_samples: 20   # 두 신호가 겹치는 길이가 rate_hz 격자로 이 샘플 수보다 짧으면 비교하지 않는다

# 바디캠 손·객체를 단안 메트릭 깊이(Depth Anything V2 Metric Indoor Small)로 카메라 좌표 3D로 올린다.
# 세션 캘리브레이션에 내부 파라미터가 없으면 default_hfov_deg로 근사한다 (액션캠 광각 기준).
depth:
  frame_stride_ms: 200      # 깊이 추론 간격 (ms, CPU 비용). 3D 궤적 샘플 간격이 된다
  default_hfov_deg: 90      # 캘리브레이션이 없을 때 가로 화각 (도, 0~180)
  patch_radius_px: 2        # 깊이를 읽을 때 주변 (2r+1)^2 픽셀의 중앙값
  min_depth_m: 0.1          # 이 범위 밖 깊이는 버린다 (m)
  max_depth_m: 10.0
  # 손목과 다섯 손가락 끝 (hand21 번호 → 온톨로지 hand_joints: wrist, thumb_tip, index_tip, middle_tip,
  # ring_tip, pinky_tip). 이름이 없는 번호는 로더가 거부한다 (policy.HAND21_JOINTS)
  hand_points: [0, 4, 8, 12, 16, 20]
  # 맞춤이 없는 키프레임(world 없음: 사람이 고친 키프레임·예전 트랙, 또는 맞춤 실패)의 손가락 끝.
  # drop: 내지 않는다 (픽셀 깊이가 얇은 손가락 대신 배경을 읽어 수백 mm 틀린다, F-PAR-40). 손바닥 관절
  # (hand_fit.anchor_points 중 hand_points에 있는 것, 지금은 손목)은 깊이로 올린다.
  # point_depth: 예전처럼 손가락 끝도 그 픽셀 깊이로 올린다 (신뢰도 sample_confidence.point_depth)
  fingertip_fallback: drop
  # 캘리브레이션 해상도와 영상의 화면비(가로/세로) 상대 차이가 이보다 크면 그 캘리브레이션을 쓰지 않고
  # default_hfov_deg 근사로 떨어진다 (4:3 모드에서 잰 값을 16:9 모드에 늘려 쓰면 비정사각 픽셀이 된다,
  # F-PAR-44). 같은 화면비의 축소(프록시)는 비례 조정한다
  max_intrinsics_aspect_mismatch: 0.02
  # 손 중심 3D 점(MediaPipe hand_world_landmarks)이 있는 손 트랙의 손가락 끝 3D (ADR 0044, dlp_prelabel.handfit).
  # 손 모양은 손 모델의 3D 점, 방향은 2D 픽셀(알려진 내부 파라미터로 이동량 최소제곱), 크기(거리)는
  # 메트릭 깊이(손바닥 관절)와 손 크기 사전값을 로그 평균으로 섞어 정한다. world가 없거나(사람이 고친
  # 트랙, 예전 버전) 맞춤이 나쁘면 예전처럼 관절마다 깊이만 쓴다.
  # 정확도 주의: 단안 추정이라 절대 거리(크기) 오차가 남는다 (손 크기 개인차 약 ±10%, 깊이 모델 오차).
  # 손 안의 상대 위치(손가락 끝 사이)는 깊이만 쓸 때보다 훨씬 낫다. 좌표는 그 시각의 카메라 좌표다
  # (frame=camera). 월드 좌표 궤적은 아래 camera_pose·world_frame 단계가 따로 만든다 (ADR 0046).
  # 캘리브레이션이 없는 세션은 default_hfov_deg 근사 내부 파라미터를 써서 오차가 더 크다.
  hand_fit:
    min_points: 8             # 맞춤에 쓰는 보이는 관절 수 하한 (적으면 맞춤 없음)
    # 맞춘 손의 상대 재투영 오차 상한: 재투영 RMS(px) / 손 2D 크기(관절이 중심에서 떨어진 거리 RMS, px).
    # 넘으면 맞춤 없음 (손 모델 3D와 2D가 어긋남). 해상도와 무관하다 (F-PAR-43). 0.4는 예전 문턱
    # 8 px을 320x240 기준 손(크기 약 19 px)에 옮긴 값이다
    max_reprojection_ratio: 0.4
    # 손 모델 자세와 카메라 축의 어긋남을 고치는 회전 다듬기 (F-PAR-42). rotation_prior는 회전을 0 쪽으로
    # 끄는 사전값 가중 (상대 재투영 잔차 단위, rad당. 0이면 회전을 다듬지 않는다). 평평한 손은 2D만으로
    # 기울기가 약하게 정해져 사전값이 잡음에 회전이 흔들리는 것을 막는다
    rotation_prior: 0.05
    max_rotation_deg: 25      # 이보다 크게 돌아야 맞으면 다듬지 않는다 (손 모양 자체가 2D와 다름)
    anchor_points: [0, 5, 9, 13, 17]  # 크기를 정할 깊이를 읽는 손바닥 관절 (손목, 손가락 뿌리 MCP)
    # 손목(0)→중지 MCP(9) 기준 길이 (m, 성인 평균 근사). null이면 손 모델 크기를 그대로 믿는다
    reference_palm_m: 0.09
    depth_weight: 0.5         # 크기 융합의 깊이 가중치 (0 손 크기만, 1 깊이만)
    max_scale_ratio: 1.5      # 깊이·손 크기 배율 비가 이보다 크면 깊이를 버린다 (배경·가림 깊이)
    # reference_palm_m은 작업자별 등록값(`dlp calib palm`, DB worker_hand_sizes)이 있으면 그 값이 앞선다
    # (작업자 값 → 이 기본값, ADR 0045). 어느 쪽을 썼는지는 3D 단계 모델 버전의 +hp<w|p>와 입력 해시에 남는다.
  # 3D 표본마다 신뢰도를 방식·맞춤 품질로 정한다 (ADR 0045, dlp_prelabel.handfit.fit_confidence).
  # 궤적 라벨 신뢰도는 표본 신뢰도의 평균이다. 단안 깊이의 절대 거리는 장면에 따라 크게 틀릴 수 있어 상한도 낮게 둔다.
  sample_confidence:
    hand_fit: 0.8             # 맞춤 표본 최고값 (재투영 0, 21관절 보임, 깊이·사전값 일치, 캘리브레이션)
    point_depth: 0.4          # 관절별 깊이·박스 중심 (픽셀 깊이 하나, 손가락 끝은 배경 깊이가 섞이기 쉽다)
    reprojection_floor: 0.5   # 상대 재투영 오차가 hand_fit.max_reprojection_ratio일 때 곱 (0이면 0까지)
    points_floor: 0.7         # 보이는 관절이 hand_fit.min_points일 때 곱 (21관절이면 1)
    agreement_floor: 0.6      # 깊이·사전값 배율 비가 hand_fit.max_scale_ratio일 때 곱 (비 1이면 1)
    no_depth: 0.7             # 깊이를 못 쓰거나 버리고 손 크기 사전값만으로 크기를 정한 맞춤에 곱
    hfov_approx: 0.6          # 캘리브레이션 없이 default_hfov_deg 근사를 쓴 표본에 곱
  # 손 3D 물리 제약 (ADR 0054, dlp_prelabel.constraints3d). 어긴 표본은 flags에 남기고 actions대로
  # 신뢰도를 낮추거나(downweight) 뺀다(drop). 손목 표시는 같은 시각 손끝에도 붙인다.
  # 대리 지표 기준(evaluation.yaml proxy)과 같은 값으로 시작했지만 따로 둔다 (측정 기준은 고정)
  constraints:
    enabled: true
    reach_m: [0.15, 0.9]      # 1인칭 카메라→손목 거리 타당 범위 (m)
    max_speed_mps: 3.0        # 손목이 한 표본만 튄 것: 들어오고 나가는 속도가 모두 이 값 초과
    max_accel_mps2: 30.0
    max_dt_ms: 400            # 이보다 먼 이웃 표본으로는 속도·가속도를 세지 않는다
    bone_tolerance: 0.25      # 손끝의 손목 거리가 세션 중앙값에서 이 비율 넘게 다르면 bone_length
    min_bone_samples: 10
    # 화각 근사처럼 배율 전체가 틀린 세션에서 표본을 대량으로 지우지 않게 reach는 downweight
    actions: {reach: downweight, speed: drop, accel: downweight, bone_length: downweight}
    downweight: 0.5

# 바디캠 6자유도 자세 (ADR 0046, dlp_prelabel.campose.ImuVisualOdometry). 동기화된 IMU 스트림(sync_method가
# unsynced가 아님)과 메트릭 깊이 모델이 있는 세션에서만 돈다. 회전은 IMU 자이로 적분 + 가속도 기울기
# 보정(중력 정렬), 이동은 이전 프레임 특징점의 메트릭 깊이 3D와 지금 프레임 2D로 회전을 고정한 채 푼다
# (두 점 RANSAC). 결과는 trajectory3d(entity_id=camera, frame=world, source_3d=visual_inertial_slam, 표본마다
# 쿼터니언). 월드 좌표: Z 위(중력 반대), 원점 = 첫 자세 카메라 중심, X = 첫 자세 광축의 수평 성분.
# 정확도 주의: 루프 닫힘·묶음 조정이 없는 오도메트리라 거리에 비례해 드리프트가 쌓이고, 배율은 깊이 모델
# 배율 오차를 그대로 따른다 (깊이 10% 편향 → 이동 10%). 요(yaw)는 자이로 편향만큼 천천히 돈다.
# TODO(real-model): 루프 닫힘·묶음 조정이 있는 외부 시각-관성 SLAM 엔진(Basalt, BSD-3, C++ 빌드·카메라-IMU
#   캘리브레이션 필요)을 `CameraPoseEstimator` 어댑터로 연동하지 않았다. 내장 IMU 시각 오도메트리만 있다
#   (ADR 0046 라이선스 조사: ORB-SLAM3·OpenVINS는 GPL-3, MASt3R·DUSt3R는 CC BY-NC라 쓰지 않는다).
camera_pose:
  enabled: true
  frame_stride_ms: 100      # 자세 표본 간격 (ms). 표본마다 깊이 추론 1회
  max_lost_ms: 1000         # 이만큼 추적을 못 하면 그 뒤는 자세를 내지 않는다 (같은 월드 좌표로 잇지 못함)
  imu:
    init_window_ms: 500     # IMU가 덮는 첫 프레임부터 이 구간 IMU로 중력 방향·자이로 편향을 정한다
    # 정지 판정: 자이로 크기 표준편차(rad/s), 자이로 평균 크기(rad/s), 가속도 크기 표준편차(m/s²)가 모두
    # 이하이고 가속도 크기 평균이 gravity ± accel_tolerance 안이면 정지로 보고 자이로 평균을 편향으로 뺀다
    static_gyro_std: 0.05
    # 평균 크기 상한은 실제 영점 편향(보통 0.01 rad/s 안팎)보다 조금 크게. 일정한 속도로 돌며 시작하면
    # 크기 표준편차는 0에 가깝지만 평균이 커서 정지가 아니다 (F-PAR-46)
    static_gyro_mean_max: 0.03
    static_acc_std: 0.3
    accel_gain: 0.1         # 가속도 기울기 보정 이득 (1/s, 상보 필터. 0이면 자이로만)
    accel_tolerance: 0.5    # 가속도 크기가 중력과 이만큼(m/s²) 안일 때만 기울기를 보정한다
    gravity: 9.81
    # IMU 표본 간격이 이보다 길면(블루투스·기록 끊김) 그 앞에서 자세를 멈춘다. 빈틈을 건너 적분하면 회전을
    # 지어낸다 (F-PAR-48). 200 Hz IMU 표본 간격(5 ms)의 10배
    max_gap_ms: 50
    # 외부 파라미터(세션 camera_imu_extrinsics, 아래 기본값)의 회전 부분 직교 허용 오차 (원소별). 넘거나 반사
    # (행렬식 음수)면 자세를 만들지 않고 이유를 남긴다. 안이면 가장 가까운 회전으로 고쳐 쓴다 (F-PAR-49)
    rotation_tolerance: 0.001
    # 세션 캘리브레이션(camera_imu_extrinsics, 수집 매니페스트)이 없을 때 쓸 IMU → 카메라 회전 (3x3 행 우선).
    # null이면 그런 세션은 자세를 만들지 않는다 (기종마다 IMU 축이 달라 틀린 기본값은 조용히 틀린 월드 좌표를 낸다)
    default_imu_to_camera: null
  features:
    max_corners: 300
    quality_level: 0.01
    min_distance_px: 8
    lk_window_px: 21
    lk_levels: 3
    lk_max_iterations: 30   # LK 반복 종료: 반복 수와 이동량(px). OpenCV 기본값과 같다 (F-PAR-55)
    lk_epsilon: 0.01
    fb_max_px: 1.0          # 앞뒤 추적 왕복 오차 상한 (px)
  translation:
    ransac_iterations: 100
    inlier_px: 2.0          # 재투영 인라이어 문턱 (px)
    min_inliers: 15         # 이보다 적으면 그 프레임은 자세 없음
    seed: 0
    depth_patch_px: 2       # 특징점 깊이를 읽는 패치 반지름
    min_depth_m: 0.2
    max_depth_m: 8.0
  confidence:
    base: 0.8               # 최고값 (단안 깊이 배율·드리프트가 남으므로 1보다 낮게)
    good_inliers: 80        # 인라이어가 이 수 이상이면 인라이어 항 1
    reprojection_floor: 0.5 # 인라이어 RMS가 translation.inlier_px일 때 곱
    no_static_init: 0.7     # 초기 정지 구간이 없어 자이로 편향을 못 뺐을 때 곱
    hfov_approx: 0.6        # 캘리브레이션 없이 화각 근사를 썼을 때 곱

# 카메라 좌표 3D 궤적 → 세션 월드 좌표 (ADR 0046, dlp_prelabel.worldframe). 같은 (개체, 부위)의 frame=world 궤적을
# 새로 만든다 (source_3d는 원래 값, derived_from = [카메라 좌표 궤적, 카메라 자세]). 표본 신뢰도 = 원래 표본 x 자세.
world_frame:
  max_pose_gap_ms: 250      # 표본 시각 양쪽 자세 표본 간격이 이보다 크면 그 표본은 바꾸지 않는다

# 작업자 손 크기 추정 (`dlp calib palm-estimate`, ADR 0045, dlp_prelabel.palm). 캘리브레이션이 있는 세션의
# 손 맞춤 중 품질 좋은 시각마다 깊이 배율만으로 잰 손목→중지 MCP 길이의 중앙값. 3D 단계 버전에는 들어가지 않는다.
palm_estimate:
  max_reprojection_ratio: 0.15  # 쓸 맞춤의 상대 재투영 오차 상한 (맞춤 기본 0.4보다 엄격, 해상도 무관)
  min_visible: 18             # 쓸 맞춤의 보이는 관절 수 하한
  min_samples: 30             # 이보다 적으면 추정하지 않는다 (200 ms 간격이면 약 6초 분량)
  palm_range_m: [0.06, 0.12]  # 받아들일 손바닥 길이 (m). 밖의 값은 깊이 오류로 보고 버린다

# 장면 분류 (ADR 0055, dlp_prelabel.scene). 도구(OWLv2) 단계 앞에서 바디캠 프레임 몇 장으로 장면을 정하고
# open_vocab_objects.scene_queries의 질의만 묻는다. 장면은 도구 단계 버전(+sc<장면>)에 들어간다.
# fixed: 늘 default (CPU·CI stub). vlm: 사내 OpenAI 호환 VLM 서버(DLP_VLM_URL, 외부 API 금지)에 블러 트랙 박스를
#   모자이크한 프레임을 보낸다 (블러 트랙이 없으면 보내지 않고 default). 사람이 알면 --scene이 앞선다.
# TODO(real-model): 사내 VLM이 없는 환경의 로컬 장면 분류기 (Places365 계열은 비상업 라이선스라 못 쓴다).
scene:
  classifier: fixed
  labels: [kitchen, bathroom, bedroom, living, unknown]
  default: unknown          # 모르면 전체 질의 (재현 우선)
  min_confidence: 0.6       # VLM 신뢰도가 이 미만이면 unknown
  sample_frames: 6          # 영상 처음·끝 10%를 뺀 구간에서 고르게
  max_side: 512             # 보낼 프레임 긴 변 (px)
  blur_tolerance_ms: 300    # 그 시각에 가장 가까운 블러 키프레임을 쓸 허용 오차
  blur_cell_px: 16          # 모자이크 칸 (px)
  vlm_model: Qwen/Qwen3-VL-8B-Instruct   # config/models.yaml external (라이선스 검사 대상)
  timeout_s: 60
