# 운영 대시보드와 보안 정책 (WP16). 원본 보관 기간은 config/defaults.yaml retention.raw_retention_days.
# 읽는 곳: dlp_ops.policy.load_policy (`dlp ops weekly|audit-report|retention`). 이 정책은 모델 버전 해시에
# 들어가지 않으므로 값을 바꿔도 파이프라인 단계가 다시 돌지 않는다 (리포트·경고에만 영향).
# 알 수 없는 키를 넣으면 로드가 실패한다 (Contract: extra=forbid).
# 정책 파일 형식 버전. 키 구조를 바꿀 때만 올린다.
version: 1

# 생산원가 = 검수 시간(모든 단계) × 시간당 인건비 ÷ 그 주 검증 완료 에피소드 수.
# 인건비는 Gate 0에서 정한다. 비어 있으면 원가 지표를 내지 않는다.
cost:
  # 검수자 시간당 인건비 (currency 단위, 0보다 커야 함). null이면 원가 지표(cost_per_episode)를 내지 않는다.
  hourly_cost: null
  # 리포트 표시용 통화 코드
  currency: KRW

# 경고 규칙 (기준 문서 "운영 지표")
alerts:
  # 자동 승인율이 오르는데 오류 삽입 발견율이 떨어지면 모델 개선이 아니라 검수 품질 저하로 본다
  auto_approval_rise: 0.02        # 직전 주 대비 이만큼 오르고
  detection_drop: 0.05            # 발견율이 이만큼 떨어지면 경고
  # 검수 시간과 수정률이 이 주 수 동안 줄지 않으면 가이드라인·온톨로지 점검 경고
  # 최소 2. 첫 주와 마지막 주를 비교하므로 너무 짧으면 잡음에 민감하다
  stagnation_weeks: 4

# 원본 접근 감사 (월 1회 검토)
audit:
  # DLP_ACTOR 값이 이 목록에 있으면 서비스 계정으로 본다 (열람 권한·업무 시간 검사 대신 용도 검사)
  service_accounts: [svc-pipeline]   # 파이프라인 계정 (사람이 아님)
  # 서비스 계정이 원본에 접근해도 되는 용도 (raw_store의 purpose = 명령 이름). 그 밖의 용도는 표시한다.
  # 실행자는 DLP_ACTOR로 스스로 밝힌 값이라, 사람이 서비스 계정 이름으로 실행한 흔적을 찾는 용도다.
  service_purposes:
    - media.ingest
    - sync.run
    - privacy.detect
    - privacy.render
    - prelabel.run
    - train.run
    - review.create
    - review.assign
    - review.collect
    - review.serve
  # 원본을 볼 수 있는 사람 = config/policies/review.yaml reviewers.privacy + 아래
  # 원본 버킷 이름·용도 문자열이 아니라 사람 ID(DLP_ACTOR, 검수 담당자 ID)를 적는다. 예: 감사인, 보안 담당
  raw_viewers: []
  timezone: Asia/Seoul               # 업무 시간 판정과 월간 리포트의 달 경계 시간대
  # [시작 시, 끝 시], 0~23. 시작 > 끝이면 자정을 넘는 구간 (22시~다음날 6시 전). timezone 기준
  off_hours: [22, 6]                 # 사람의 원본 접근이 이 시간대(시작 시 이상, 끝 시 미만)면 표시

retention:
  # 원본 보관 기간 만료 알림 (dlp ops retention). 기간 자체는 config/defaults.yaml retention.raw_retention_days
  # (null이면 사용 중지 세션만 알린다). 0 이상 정수(일)
  alert_days_before: 30              # 만료 이 일수 전부터 알린다
