# 행동 구간 2단 구조 정책 (WP10).
# 1단: 손목 속도와 접촉 신호로 경계 후보를 만든다 (VLM은 경계를 정하지 않는다).
# 2단: VLM이 후보 구간마다 온톨로지 목록 안에서 행동·사이 구간 종류를 고르고 한 문장 설명을 쓴다.
# 같은 분류의 인접 구간은 병합하고, 행동이 아닌 구간은 대기·미상·범위 외로 채워 공백을 없앤다.
version: 1

# 장갑만 잡아 대상을 모르는 접촉의 target_id (prelabel.yaml contact.unresolved_target_id).
# VLM에 대상·도구 후보로 주지 않는다.
unresolved_entity_ids: [unresolved]

boundaries:
  # 속도 단위: 손바닥 길이(손목→가운뎃손가락 뿌리, hand21 0→9)/초. 해상도·거리와 무관하게 쓴다.
  smooth_ms: 100              # 속도 이동 평균 창
  still_speed: 2.0            # 이보다 느리면 정지
  min_still_ms: 120           # 정지가 이만큼 이어지면 그 시작·끝을 경계 후보로 둔다
  valley_speed: 15.0          # 접촉 밖에서 속도 골짜기가 이보다 낮으면 경계 후보 (멈추지 않고 방향 전환)
  valley_ratio: 0.4           # 골짜기는 앞뒤 valley_window_ms 안 최고 속도의 이 비율 이하여야 한다
  valley_window_ms: 300
  min_valley_separation_ms: 150
  merge_ms: 80                # 이보다 가까운 후보는 하나로 (접촉 경계를 우선)
  min_segment_ms: 100

# 평가 허용 오차 (기준 문서 경계 규칙). 테스트와 평가 하네스(WP11)가 쓴다.
tolerance_ms:
  approach: 200
  contact_glove: 70
  contact_video: 150
  end: 200

vlm:
  max_retries: 2              # 스키마 위반·온톨로지 밖 응답이면 위반을 알려 다시 묻는다.
                              # 그래도 안 되면 그 구간만 미상(unknown)이다
  # 서버 오류·시간 초과면 이만큼(초) 기다리며 다시 묻는다 (길이 = 재시도 횟수). 끝내 실패하면 미상으로
  # 두지 않고 그 세션 실행을 멈춘다 (트랜잭션을 되돌려 아무것도 쓰지 않는다. 장애를 미상으로 쓰면
  # 같은 버전이라 재실행이 건너뛰어 영구히 미상으로 남는다). 결과를 바꾸지 않아 모델 버전에 넣지 않는다.
  unavailable_backoff_s: [2, 10, 30]
  frames_per_segment: 8
  max_side_px: 448            # VLM에 보낼 프레임 긴 변
  default_confidence: 0.5     # 응답에 신뢰도가 없을 때
  # TODO(real-model): VLM 추론 서버(OpenAI 호환 API)가 필요하다. GPU면 vLLM, CPU면 llama.cpp
  #   llama-server(GGUF)로 띄울 수 있다 (CPU는 느려 timeout_s를 늘린다). 서버 주소는
  #   DLP_VLM_URL 환경 변수로 준다. 라이선스는 config/models.yaml external에서 검사한다. 모델은 상업 사용 가능한 라이선스여야 한다 (ADR 0010).
  #   Qwen2.5-VL-7B-Instruct는 Apache-2.0, 3B는 비상업 연구 라이선스라 쓰지 않는다.
  model: Qwen/Qwen2.5-VL-7B-Instruct
  timeout_s: 120
