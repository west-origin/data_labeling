[project]
name = "dlp-cli"
version = "0.1.0"
description = "dlp 명령줄 진입점"
requires-python = ">=3.12,<3.14"
dependencies = ["dlp-actions", "dlp-datasets", "dlp-eval", "dlp-fixtures", "dlp-media", "dlp-models", "dlp-prelabel", "dlp-privacy", "dlp-relations", "dlp-review", "dlp-schema", "dlp-sync"]

[project.scripts]
dlp = "dlp_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_cli"]
