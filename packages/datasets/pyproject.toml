[project]
name = "dlp-datasets"
version = "0.1.0"
description = "데이터셋 버전, 작업자·장소 단위 분할, 골든셋, 사용 중지 전파, 계보"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlp-schema",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_datasets"]
