[project]
name = "dlp-prelabel"
version = "0.1.0"
description = "자동 프리라벨 어댑터: 손·전신 포즈, 객체, 접촉, 착용자 매칭 (공통 Predictor + stub)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=14.0",
    "dlp-media",
    "dlp-schema",
    "dlp-sync",
    "mediapipe>=1.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_prelabel"]
