[project]
name = "dlp-train"
version = "0.1.0"
description = "재학습 루프: 데이터셋 버전에서 학습 데이터 추출, 학습 작업, MLflow 기록, 모델 레지스트리, 게이트 배포"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlp-datasets",
    "dlp-eval",
    "dlp-media",
    "dlp-schema",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_train"]
