[project]
name = "dlp-privacy"
version = "0.1.0"
description = "프라이버시 게이트: 블러 대상 탐지, 추적·유지, 렌더, 검수 우선 구간, 잔여 누락 감사"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=14.0",
    "dlp-media",
    "dlp-schema",
    "numpy>=2.0",
    "opencv-contrib-python-headless>=4.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_privacy"]
