# 운영 콘솔 (ADR 0061): 브라우저 화면 하나에서 기존 `dlp <단계>` 명령을 작업으로 돌리고 상태·결과를 보인다.
# 도메인 로직은 두지 않는다. 웹 서버는 FastAPI(MIT) + uvicorn(BSD-3) + python-multipart(Apache-2.0, 업로드).
[project]
name = "dlp-console"
version = "0.1.0"
description = "운영 콘솔: 단계 명령 실행·상태·결과·재학습 추이 화면"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlp-media",
    "dlp-models",
    "dlp-review",
    "dlp-schema",
    "fastapi==0.162.0",
    "python-multipart==0.0.32",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_console"]
