[project]
name = "dlp-schema"
version = "0.1.0"
description = "세션·스트림·라벨·에피소드 그래프 계약 타입, 온톨로지, 데이터베이스 스키마"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.40",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_schema"]
