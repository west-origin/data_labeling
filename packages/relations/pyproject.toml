[project]
name = "dlp-relations"
version = "0.1.0"
description = "관계 도출(YAML 규칙 엔진)과 도구-표면 접촉·표면 커버리지"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dlp-schema",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_relations"]
