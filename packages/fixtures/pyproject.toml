[project]
name = "dlp-fixtures"
version = "0.1.0"
description = "정답을 아는 합성 데이터 생성기 (동기화 신호, 블러 대상 영상, 행동 시퀀스, 가짜 세션)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=14.0",
    "dlp-schema",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "segno>=1.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_fixtures"]
