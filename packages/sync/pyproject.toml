[project]
name = "dlp-sync"
version = "0.1.0"
description = "멀티스트림 동기화: QR 슬레이트, 두드림, 오디오·운동 상호상관, 드리프트 보정"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=14.0",
    "dlp-media",
    "dlp-schema",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_sync"]
