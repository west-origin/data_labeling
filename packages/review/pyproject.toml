[project]
name = "dlp-review"
version = "0.1.0"
description = "검수 도구 연동: CVAT·Label Studio 변환기, 작업 생성, 결과 수집, 권한, 워터마크"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=14.0",
    "dlp-eval",
    "dlp-media",
    "dlp-schema",
    "dlp-sync",
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-contrib-python-headless>=4.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_review"]
